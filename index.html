          <p style="font-size:0.85rem; color:var(--ink-muted); margin-top:0;">Choose which classes (including newly created classes) can participate in <strong>${escapeHtml(el.title)}</strong>.</p>
          <form id="m-eec">
            <label style="display:block; margin-bottom:0.55rem; font-size:0.86rem; font-weight:700;"><input type="checkbox" id="ee-c-all" ${isAll ? 'checked' : ''} /> All Classrooms (Including New Classes)</label>
            <div style="display:flex; gap:0.75rem; flex-wrap:wrap; margin-bottom:1rem;">${clsChecks}</div>
            <div class="modal-actions two-col"><button type="button" class="btn btn-outline" id="ee-x">Cancel</button><button type="submit" class="btn btn-primary">Save Classes</button></div>
          </form>
        `);
        document.getElementById('ee-x').addEventListener('click', closeModal);
        const allChk = document.getElementById('ee-c-all');
        allChk.addEventListener('change', () => {
          document.querySelectorAll('input[name="ee-c"]').forEach((chk) => { chk.checked = allChk.checked; });
        });
        document.getElementById('m-eec').addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            const nextIds = allChk.checked
              ? ['*']
              : Array.from(document.querySelectorAll('input[name="ee-c"]:checked')).map((i) => i.value);
            const savedIds = await Store.updateElectionClassrooms(eid, nextIds);
            el.eligibleClassroomIds = savedIds;
            closeModal();
            toast('Eligible classrooms updated!', 'success');
            render();
          } catch (err) {
            toast(Store.formatError(err), 'error');
          }
        });
      });
    });

    document.querySelectorAll('[data-host-open-el]').forEach((b) => {
      b.addEventListener('click', async () => {
        const eid = b.getAttribute('data-host-open-el');
        b.disabled = true;
        try {
          const startAtMs = await Store.startElectionNow(eid);
          const el = ws.elections.find((x) => x.id === eid);
          if (el) {
            el.startAtMs = startAtMs;
            el.status = 'active';
          }
          toast('Election is now OPEN for voting!', 'success');
          render();
        } catch (err) {
          b.disabled = false;
          toast(Store.formatError(err), 'error');
        }
      });
    });

    document.querySelectorAll('[data-host-add-cand]').forEach((b) => {
      b.addEventListener('click', () => {
        const eid = b.getAttribute('data-host-add-cand');
        let uploadedPhotoDataUrl = '';
        openModal(`
          <h3 style="margin-top:0;">Add Approved Candidate</h3>
          <form id="m-hc">
            <div class="form-group">
              <label class="form-label">Candidate Profile Photo</label>
              <div style="display:flex; gap:0.75rem; align-items:center; flex-wrap:wrap;">
                <img id="hc-photo-preview" class="avatar-circle" style="width:54px; height:54px; display:none;" alt="Candidate preview" />
                <input type="file" class="input" id="hc-photo" accept="image/*" style="flex:1; min-width:190px; padding:0.45rem;" />
                <button type="button" class="btn btn-outline btn-sm" id="hc-photo-clear" style="display:none;">Clear</button>
              </div>
            </div>
            <div class="form-group"><label class="form-label">Name</label><input class="input" id="hc-n" required /></div>
            <div class="form-group"><label class="form-label">Classroom</label><input class="input" id="hc-c" required /></div>
            <div class="form-group"><label class="form-label">Slogan</label><input class="input" id="hc-s" /></div>
            <div class="form-group"><label class="form-label">Manifesto</label><textarea class="textarea" id="hc-m" rows="2"></textarea></div>
            <div class="modal-actions two-col"><button type="button" class="btn btn-outline" id="hc-x">Cancel</button><button type="submit" class="btn btn-primary">Add Candidate</button></div>
          </form>
        `);
        const photoInput = document.getElementById('hc-photo');
        const photoPreview = document.getElementById('hc-photo-preview');
        const photoClear = document.getElementById('hc-photo-clear');
        photoInput.addEventListener('change', async () => {
          const file = photoInput.files?.[0];
          if (!file) return;
          try {
            uploadedPhotoDataUrl = await readCandidatePhotoFile(file);
            photoPreview.src = uploadedPhotoDataUrl;
            photoPreview.style.display = 'block';
            photoClear.style.display = 'inline-flex';
          } catch (err) {
            toast(err.message, 'error');
          }
        });
        photoClear.addEventListener('click', () => {
          uploadedPhotoDataUrl = '';
          photoInput.value = '';
          photoPreview.style.display = 'none';
          photoClear.style.display = 'none';
        });
        document.getElementById('hc-x').addEventListener('click', closeModal);
        document.getElementById('m-hc').addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            const nom = await Store.addCandidateNomination(comm.id, eid, {
              studentUid: '',
              fullName: document.getElementById('hc-n').value,
              classroomName: document.getElementById('hc-c').value,
              slogan: document.getElementById('hc-s').value,
              manifesto: document.getElementById('hc-m').value,
              photoDataUrl: uploadedPhotoDataUrl,
              status: 'approved',
            });
            (ws.nominationsByElection[eid] ||= []).push(nom);
            closeModal();
            toast('Candidate added!', 'success');
            render();
          } catch (err) {
            toast(Store.formatError(err), 'error');
          }
        });
      });
    });

    document.querySelectorAll('[data-nom-act]').forEach((b) => {
      b.addEventListener('click', async () => {
        const eid = b.getAttribute('data-eid');
        const nid = b.getAttribute('data-nid');
        const act = b.getAttribute('data-nom-act');
        try {
          await Store.reviewNomination(eid, nid, act);
          const target = (ws.nominationsByElection[eid] || []).find((n) => n.id === nid);
          if (target) target.status = act;
          render();
        } catch (err) {
          toast(Store.formatError(err), 'error');
        }
      });
    });

    document.querySelectorAll('[data-host-close-el]').forEach((b) => {
      b.addEventListener('click', async () => {
        const eid = b.getAttribute('data-host-close-el');
        b.disabled = true;
        try {
          const { endAtMs, rows } = await Store.closeElectionNow(eid, ws.nominationsByElection[eid] || []);
          const el = ws.elections.find((x) => x.id === eid);
          if (el) {
            el.endAtMs = endAtMs;
            el.status = 'closed';
            el.resultsReady = true;
          }
          ws.resultsByElection[eid] = rows;
          toast('Election closed! Review & publish in Results tab.', 'success');
          render();
        } catch (err) {
          b.disabled = false;
          toast(Store.formatError(err), 'error');
        }
      });
    });

    document.querySelectorAll('[data-host-del-el]').forEach((b) => {
      b.addEventListener('click', async () => {
        const eid = b.getAttribute('data-host-del-el');
        try {
          await Store.deleteElection(eid);
          ws.elections = ws.elections.filter((x) => x.id !== eid);
          render();
        } catch (err) {
          toast(Store.formatError(err), 'error');
        }
      });
    });

    document.querySelectorAll('[data-stu-nom]').forEach((b) => {
      b.addEventListener('click', () => {
        const eid = b.getAttribute('data-stu-nom');
        openModal(`
          <h3 style="margin-top:0;">Submit Candidate Nomination</h3>
          <form id="m-snom">
            <div class="form-group"><label class="form-label">Campaign Slogan</label><input class="input" id="sn-s" placeholder="e.g. Transparency First" /></div>
            <div class="form-group"><label class="form-label">Manifesto</label><textarea class="textarea" id="sn-m" rows="3" required minlength="5"></textarea></div>
            <div class="modal-actions two-col"><button type="button" class="btn btn-outline" id="sn-x">Cancel</button><button type="submit" class="btn btn-primary">Submit</button></div>
          </form>
        `);
        document.getElementById('sn-x').addEventListener('click', closeModal);
        document.getElementById('m-snom').addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            const clsName = ws.classrooms.find((c) => c.id === user.classroomId)?.name || '';
            const nom = await Store.addCandidateNomination(comm.id, eid, {
              studentUid: user.uid,
              fullName: user.fullName,
              classroomName: clsName,
              slogan: document.getElementById('sn-s').value,
              manifesto: document.getElementById('sn-m').value,
              status: 'pending',
            });
            (ws.nominationsByElection[eid] ||= []).push(nom);
            closeModal();
            toast('Nomination submitted! Results stay hidden until Host publishes.', 'success');
            render();
          } catch (err) {
            toast(Store.formatError(err), 'error');
          }
        });
      });
    });

    function openStudentBiometricUpdateModal() {
      let scannedBiometric = null;
      openModal(`
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
          <h3 style="margin:0;">Update Face Biometric</h3>
          <button type="button" class="btn btn-outline btn-sm" id="bio-upd-x">Cancel</button>
        </div>
        <p style="font-size:0.86rem; color:var(--ink-muted); margin-top:0;">
          ${escapeHtml(user.biometricUpdateReason || 'Look directly into the camera. It scans automatically — Save unlocks as soon as captured.')}
        </p>
        <div class="face-viewport" id="bio-upd-viewport">
          <video id="bio-upd-video" autoplay playsinline muted></video>
          <canvas id="bio-upd-overlay" class="face-overlay-canvas" width="360" height="270"></canvas>
          <div class="face-oval-guide"></div>
        </div>
        <div id="bio-upd-status" class="alert alert-info" style="margin-top:0.8rem;">Starting live face scanner...</div>
        <div class="modal-actions two-col">
          <button type="button" class="btn btn-outline" id="bio-upd-rescan">Rescan</button>
          <button type="button" class="btn btn-primary" id="bio-upd-save" disabled>Scanning Face...</button>
        </div>
      `);

      const saveBtn = document.getElementById('bio-upd-save');
      const statusEl = document.getElementById('bio-upd-status');
      const cam = Face.mountAutoFaceScanner({
        viewportEl: document.getElementById('bio-upd-viewport'),
        videoEl: document.getElementById('bio-upd-video'),
        overlayEl: document.getElementById('bio-upd-overlay'),
        statusEl,
        mode: 'enroll',
        onReady: (sample) => {
          scannedBiometric = sample;
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.textContent = 'Save Biometric ✓';
          }
        },
      });
      state.camCleanup = cam.stop;

      document.getElementById('bio-upd-rescan').addEventListener('click', () => {
        scannedBiometric = null;
        if (saveBtn) {
          saveBtn.disabled = true;
          saveBtn.textContent = 'Scanning Face...';
        }
        cam.rescan();
      });

      document.getElementById('bio-upd-x').addEventListener('click', closeModal);
      saveBtn.addEventListener('click', async () => {
        if (!scannedBiometric) return;
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';
        try {
          const capturedFace = scannedBiometric;
          const res = await Store.submitStudentBiometricUpdate({ user, capturedFace });
          user.avatarDataUrl = res.snapshotDataUrl;
          user.faceVec = capturedFace.descriptor;
          user.alignedPatch = capturedFace.alignedPatch || null;
          user.biometricUpdateRequested = false;
          user.biometricUpdateReason = '';
          user.biometricUpdatedAt = res.biometricUpdatedAt;
          state.prefetchedFace = {
            uid: user.uid,
            descriptor: capturedFace.descriptor,
            alignedPatch: capturedFace.alignedPatch || null,
            snapshotDataUrl: res.snapshotDataUrl,
          };
          closeModal();
          toast('Face biometric updated successfully!', 'success');
          render();
        } catch (err) {
          statusEl.className = 'alert alert-danger';
          statusEl.textContent = Store.formatError(err);
          scannedBiometric = null;
          saveBtn.disabled = true;
          saveBtn.textContent = 'Scanning Face...';
          cam.rescan();
        }
      });
    }

    document.getElementById('banner-update-biometric-btn')?.addEventListener('click', openStudentBiometricUpdateModal);
    document.getElementById('profile-update-biometric-btn')?.addEventListener('click', openStudentBiometricUpdateModal);
    document.getElementById('req-update-biometric-btn')?.addEventListener('click', openStudentBiometricUpdateModal);

    // Submit Vote -> Instant Face Scan & Atomic Ballot Record
    document.querySelectorAll('[data-stu-vote]').forEach((b) => {
      b.addEventListener('click', () => {
        if (user.biometricUpdateRequested) {
          toast('Please complete the Host-requested biometric update before voting.', 'info');
          openStudentBiometricUpdateModal();
          return;
        }
        const eid = b.getAttribute('data-stu-vote');
        const el = ws.elections.find((x) => x.id === eid);
        const picked = document.querySelector(`input[name="vote-el-${eid}"]:checked`);
        if (!picked) {
          toast('Select an approved candidate first.', 'error');
          return;
        }
        const nominationId = picked.value;
        if (!state.prefetchedFace) warmFaceProfile(user);

        let verifiedSample = null;
        openModal(`
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
            <h3 style="margin:0;">Automatic Face Verification</h3>
            <button type="button" class="btn btn-outline btn-sm" id="fv-x">Cancel</button>
          </div>
          <p style="font-size:0.86rem; color:var(--ink-muted); margin-top:0;">Look into your live camera. No clicks needed — Vote unlocks automatically once your face matches.</p>
          <div class="face-viewport" id="fv-viewport">
            <video id="fv-video" autoplay playsinline muted></video>
            <canvas id="fv-overlay" class="face-overlay-canvas" width="360" height="270"></canvas>
            <div class="face-oval-guide"></div>
          </div>
          <div id="fv-status" class="alert alert-info" style="margin-top:0.8rem;">Loading biometric profile & camera...</div>
          <div class="modal-actions two-col">
            <button type="button" class="btn btn-outline" id="fv-rescan">Scan Again</button>
            <button type="button" class="btn btn-success" id="fv-go" disabled>Waiting for Face Match...</button>
          </div>
        `);

        const fvGoBtn = document.getElementById('fv-go');
        const fvStatusEl = document.getElementById('fv-status');
        document.getElementById('fv-x').addEventListener('click', closeModal);

        (async () => {
          const enrolledProfile =
            state.prefetchedFace ||
            (await Store.fetchFaceProfile(user.uid).catch(() => null)) ||
            (user.faceVec ? { descriptor: user.faceVec, alignedPatch: user.alignedPatch } : null);
          if (enrolledProfile) state.prefetchedFace = enrolledProfile;
          if (!document.getElementById('fv-video')) return;

          if (!enrolledProfile) {
            fvStatusEl.className = 'alert alert-danger';
            fvStatusEl.textContent = 'Enrolled biometric not found. Ask Host to request a biometric update.';
            return;
          }

          const cam = Face.mountAutoFaceScanner({
            viewportEl: document.getElementById('fv-viewport'),
            videoEl: document.getElementById('fv-video'),
            overlayEl: document.getElementById('fv-overlay'),
            statusEl: fvStatusEl,
            mode: 'verify',
            enrolledProfile,
            onVerified: (sample, res) => {
              verifiedSample = sample;
              if (fvGoBtn) {
                fvGoBtn.disabled = false;
                fvGoBtn.textContent = `Submit Vote (${res.scorePct}% ✓)`;
              }
            },
            onStatus: (st) => {
              if (st.kind !== 'matched') {
                verifiedSample = null;
                if (fvGoBtn && !fvGoBtn.dataset.submitting) {
                  fvGoBtn.disabled = true;
                  fvGoBtn.textContent = 'Waiting for Face Match...';
                }
              }
            },
          });
          state.camCleanup = cam.stop;

          document.getElementById('fv-rescan')?.addEventListener('click', () => {
            verifiedSample = null;
            fvGoBtn.disabled = true;
            fvGoBtn.textContent = 'Waiting for Face Match...';
            cam.rescan();
          });
        })();

        fvGoBtn.addEventListener('click', async () => {
          if (!verifiedSample) return;
          fvGoBtn.dataset.submitting = '1';
          fvGoBtn.disabled = true;
          fvGoBtn.textContent = 'Submitting Vote...';
          try {
            const result = await Store.castFaceVerifiedVote({
              user,
              election: el,
              nominationId,
              liveSample: verifiedSample,
              prefetchedFace: state.prefetchedFace,
            });
            (ws.participationByElection[eid] ||= []).push({
              electionId: eid,
              studentUid: user.uid,
              receiptHash: result.receipt,
              votedAt: Date.now(),
            });
            closeModal();
            toast(`Vote Verified (${result.similarityPct}%)! Receipt: ${result.receipt}`, 'success');
            render();
          } catch (err) {
            delete fvGoBtn.dataset.submitting;
            fvStatusEl.className = 'alert alert-danger';
            fvStatusEl.textContent = Store.formatError(err, 'vote');
            fvGoBtn.disabled = true;
            fvGoBtn.textContent = 'Waiting for Face Match...';
          }
        });
      });
    });

    document.querySelectorAll('[data-pub-res]').forEach((b) => {
      b.addEventListener('click', async () => {
        const eid = b.getAttribute('data-pub-res');
        const el = ws.elections.find((x) => x.id === eid);
        if (!el) return;
        b.disabled = true;
        try {
          const rows = await Store.publishElectionResults(user, comm.id, el, ws.nominationsByElection[eid] || []);
          el.resultsPublished = true;
          ws.resultsByElection[eid] = rows;
          toast('Results published to students & candidates!', 'success');
          render();
        } catch (err) {
          b.disabled = false;
          toast(Store.formatError(err), 'error');
        }
      });
    });

    document.querySelectorAll('[data-export-csv]').forEach((b) => {
      b.addEventListener('click', () => {
        const eid = b.getAttribute('data-export-csv');
        const el = ws.elections.find((x) => x.id === eid);
        const rows = ws.resultsByElection[eid] || [];
        const csv = ['Candidate,Classroom,Votes,Percentage,Winner', ...rows.map((r) => `"${r.fullName}","${r.classroomName}",${r.voteCount},${r.percentage}%,${r.isWinner}`)].join('\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        a.download = `${(el?.title || 'election').replace(/\s+/g, '_')}_results.csv`;
        a.click();
      });
    });
    document.getElementById('print-results-btn')?.addEventListener('click', () => window.print());

    document.getElementById('theme-light-btn')?.addEventListener('click', () => {
      applyTheme('light');
      render();
    });
    document.getElementById('theme-dark-btn')?.addEventListener('click', () => {
      applyTheme('dark');
      render();
    });

    document.getElementById('edit-my-profile-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const name = document.getElementById('ep-name').value;
        const bio = document.getElementById('ep-bio').value;
        await Store.updateUserProfile(user.uid, name, bio);
        state.sessionUser.fullName = name.trim();
        state.sessionUser.bio = bio.trim();
        toast('Profile saved!', 'success');
        render();
      } catch (err) {
        toast(Store.formatError(err), 'error');
      }
    });
  }

  function render() {
    if (state.isBooting) {
      document.getElementById('app').innerHTML = `
        <div class="portal-bg" style="align-items:center; justify-content:center;">
          <canvas id="login-anim-canvas" class="login-anim-canvas"></canvas>
          <div style="position:relative; z-index:2; text-align:center;">
            ${logoHeaderHtml()}
            <p style="color:var(--ink-muted); font-weight:600; margin-top:0.65rem;">Loading Election Portal...</p>
          </div>
        </div>
      `;
      startLoginBgAnimation();
    document.getElementById('landing-install-btn')?.addEventListener('click', triggerInstallApp);
      return;
    }

    if (state.onboardingInvite) renderOnboarding();
    else if (state.sessionUser && state.ws) renderWorkspace();
    else renderLanding();
  }

  render();
  setupAuthListener();
})();

  </script>
</body>
</html>
