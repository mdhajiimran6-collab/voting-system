<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6366F1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CampusConnect" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>CampusConnect — College Community & Face-Verified Elections</title>
  <style>
:root {
  /* Light Theme Palette + Instagram Button Accents */
  --bg: #FAFAFA;
  --bg-soft: #FFF1E3;
  --surface: #FFFFFF;
  --surface-alt: #F3F4F6;
  --ink: #111827;
  --ink-muted: #4B5563;
  --ink-light: #6B7280;
  --border: #E5E7EB;
  --border-strong: #D1D5DB;
  --saffron: #FF9933;
  --saffron-deep: #E1306C;
  --saffron-soft: #FFF1F5;
  --chakra-blue: #0F2D7A;
  --chakra-bright: #0095F6;
  --chakra-soft: #EFF6FF;
  --india-green: #138808;
  --india-green-dark: #0E6A05;
  --india-green-soft: #ECFDF3;
  --danger: #ED4956;
  --danger-soft: #FFF1F2;
  --ig-gradient: linear-gradient(45deg, #F09433 0%, #E6683C 25%, #DC2743 50%, #CC2366 75%, #BC1888 100%);
  --shadow-sm: 0 4px 16px rgba(15, 23, 42, 0.06);
  --shadow-lg: 0 24px 56px rgba(15, 23, 42, 0.14);
  --radius: 18px;
}

:root[data-theme="dark"] {
  --bg: #0B101B;
  --bg-soft: #111827;
  --surface: #141B2D;
  --surface-alt: #1C253B;
  --ink: #F3F4F6;
  --ink-muted: #CBD5E1;
  --ink-light: #94A3B8;
  --border: #26324B;
  --border-strong: #374667;
  --saffron: #FF9933;
  --saffron-deep: #F472B6;
  --saffron-soft: rgba(225, 48, 108, 0.16);
  --chakra-blue: #60A5FA;
  --chakra-bright: #38BDF8;
  --chakra-soft: rgba(56, 189, 248, 0.14);
  --india-green: #22C55E;
  --india-green-dark: #16A34A;
  --india-green-soft: rgba(34, 197, 94, 0.14);
  --danger: #FB7185;
  --danger-soft: rgba(251, 113, 133, 0.15);
  --shadow-sm: 0 6px 20px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 24px 56px rgba(0, 0, 0, 0.56);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.tricolor-ribbon {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  z-index: 100;
  background: linear-gradient(90deg, #FF9933 0%, #FF9933 33%, #FFFFFF 33%, #FFFFFF 66%, #138808 66%, #138808 100%);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
}

button, input, select, textarea { font-family: inherit; font-size: 0.96rem; }

/* ---------- Instagram Style Tactile Buttons ---------- */
.btn {
  position: relative;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  min-height: 44px;
  padding: 0.62rem 1.2rem;
  border-radius: 12px;
  border: 1px solid transparent;
  font-weight: 700;
  font-size: 0.9rem;
  letter-spacing: -0.01em;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  max-width: 100%;
  transition: transform 0.12s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.18s ease, filter 0.16s ease, background 0.16s ease;
}
.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0) 50%);
  pointer-events: none;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.05); }
.btn:active:not(:disabled) { transform: scale(0.95); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(135deg, #0095F6 0%, #1877F2 100%);
  color: #FFFFFF;
  box-shadow: 0 6px 18px rgba(0, 149, 246, 0.3);
}
.btn-gold {
  background: var(--ig-gradient);
  color: #FFFFFF;
  box-shadow: 0 8px 20px rgba(220, 39, 67, 0.3);
}
.btn-success {
  background: linear-gradient(135deg, #10B981 0%, #059669 100%);
  color: #FFFFFF;
  box-shadow: 0 6px 18px rgba(16, 185, 129, 0.28);
}
.btn-danger {
  background: linear-gradient(135deg, #FF4D67 0%, #ED4956 100%);
  color: #FFFFFF;
  box-shadow: 0 6px 16px rgba(237, 73, 86, 0.26);
}
.btn-outline {
  background: var(--surface-alt);
  color: var(--ink);
  border-color: var(--border-strong);
}
.btn-outline:hover:not(:disabled) { border-color: #DC2743; background: var(--saffron-soft); color: #DC2743; }
:root[data-theme="dark"] .btn-outline:hover:not(:disabled) { color: #F472B6; border-color: #F472B6; }
.btn-glass {
  background: rgba(255, 255, 255, 0.16);
  color: #FFFFFF;
  border: 1px solid rgba(255, 255, 255, 0.28);
  backdrop-filter: blur(10px);
}
.btn-sm { min-height: 36px; padding: 0.38rem 0.85rem; font-size: 0.81rem; border-radius: 10px; }

.modal-actions,
.action-row {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 0.6rem;
  flex-wrap: wrap;
}

/* ---------- Sketch-Matched India Elections Animated Landing ---------- */
.portal-bg {
  position: relative;
  min-height: 100vh;
  overflow-x: hidden;
  background: linear-gradient(160deg, #FFF5EB 0%, #FFFFFF 48%, #EEFBF0 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.75rem 1rem;
}

.login-anim-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

.aurora-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(85px);
  opacity: 0.48;
  pointer-events: none;
  z-index: 0;
  animation: floatOrb 15s ease-in-out infinite alternate;
}
.orb-1 { width: 420px; height: 420px; background: radial-gradient(circle, rgba(255, 153, 51, 0.5), transparent 70%); top: -120px; left: -100px; }
.orb-2 { width: 420px; height: 420px; background: radial-gradient(circle, rgba(19, 136, 8, 0.38), transparent 70%); bottom: -110px; right: -90px; animation-delay: -5s; }
.orb-3 { width: 280px; height: 280px; background: radial-gradient(circle, rgba(15, 45, 122, 0.28), transparent 70%); top: 38%; left: 56%; animation-delay: -10s; }

@keyframes floatOrb {
  0% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(30px, -22px, 0) scale(1.08); }
  100% { transform: translate3d(-22px, 26px, 0) scale(0.95); }
}
@media (prefers-reduced-motion: reduce) { .aurora-orb { animation: none; } }

.portal-foreground { position: relative; z-index: 2; width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 1rem; }

.portal-logo-wrap { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0.42rem; }
.portal-logo-icon {
  width: 66px;
  height: 66px;
  border-radius: 20px;
  background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
  border: 2.5px solid var(--chakra-blue);
  display: grid;
  place-items: center;
  box-shadow: 0 14px 30px rgba(15, 45, 122, 0.22);
}
.portal-logo-title { font-size: 1.55rem; font-weight: 800; color: var(--chakra-blue); letter-spacing: -0.025em; margin: 0; }
.portal-logo-sub { font-size: 0.84rem; color: var(--ink-muted); margin: 0; font-weight: 600; }

/* Centered Stu | Host pill switcher right below Logo */
.portal-switcher {
  width: 100%;
  max-width: 360px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: rgba(255, 255, 255, 0.88);
  border: 1.5px solid var(--border-strong);
  border-radius: 999px;
  padding: 0.34rem;
  gap: 0.34rem;
  backdrop-filter: blur(14px);
  box-shadow: 0 10px 24px rgba(15, 45, 122, 0.1);
}
.portal-switch-btn {
  border: none;
  background: transparent;
  color: var(--ink-muted);
  min-height: 44px;
  padding: 0.55rem 1rem;
  border-radius: 999px;
  font-weight: 800;
  font-size: 0.94rem;
  cursor: pointer;
  touch-action: manipulation;
  transition: all 0.2s ease;
}
.portal-switch-btn.active-student {
  background: linear-gradient(135deg, #1E40AF, #0F2D7A);
  color: #FFFFFF;
  box-shadow: 0 6px 16px rgba(15, 45, 122, 0.3);
}
.portal-switch-btn.active-host {
  background: linear-gradient(135deg, #FFAC4B, #FF9933, #EA580C);
  color: #FFFFFF;
  box-shadow: 0 6px 16px rgba(234, 88, 12, 0.3);
}

.portal-card {
  width: 100%;
  border-radius: 26px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.94);
  box-shadow: var(--shadow-lg);
  border: 1.5px solid rgba(255, 153, 51, 0.38);
  backdrop-filter: blur(20px);
}
.portal-left { color: var(--ink); padding: 1.85rem 1.7rem; }
.portal-feature-strip {
  background: linear-gradient(90deg, rgba(255, 153, 51, 0.14) 0%, rgba(255, 255, 255, 0.9) 50%, rgba(19, 136, 8, 0.14) 100%);
  border-top: 1px solid var(--border);
  padding: 0.95rem 1.5rem;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.45rem 0.9rem;
  font-size: 0.78rem;
  color: var(--ink);
  font-weight: 700;
}

.auth-tabs { display: grid; grid-template-columns: 1fr 1.35fr; gap: 0.5rem; margin-bottom: 1.15rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; }
.auth-tab { min-height: 42px; background: #FFF7ED; color: var(--ink-muted); border: 1px solid var(--border); padding: 0.5rem 0.75rem; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 0.84rem; transition: all 0.16s ease; }
.auth-tab.active { background: linear-gradient(135deg, #FF9933, #EA580C); color: #FFFFFF; border-color: transparent; box-shadow: 0 6px 14px rgba(234, 88, 12, 0.25); }

.dark-field { margin-bottom: 0.95rem; }
.dark-field label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--ink-muted); margin-bottom: 0.32rem; }
.dark-input { width: 100%; min-height: 46px; background: #F8FAFC; border: 1.5px solid var(--border-strong); border-radius: 13px; padding: 0.65rem 0.92rem; color: var(--ink); outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
.dark-input:focus { border-color: var(--chakra-blue); background: #FFFFFF; box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.14); }
.dark-input::placeholder { color: #94A3B8; }

.fee-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; margin-bottom: 0.95rem; }
.fee-card { border: 1.5px solid var(--border-strong); border-radius: 14px; padding: 0.75rem 0.9rem; background: #FFFDF9; cursor: pointer; color: var(--ink); text-align: left; min-height: 64px; transition: all 0.15s ease; }
.fee-card.selected { border-color: var(--saffron-deep); background: #FFF7ED; box-shadow: 0 0 0 2px rgba(255, 153, 51, 0.32); }

.otp-card { position: relative; z-index: 2; width: 100%; max-width: 600px; background: rgba(255, 255, 255, 0.95); color: var(--ink); border: 1.5px solid rgba(255, 153, 51, 0.4); border-radius: 26px; padding: 1.85rem; box-shadow: var(--shadow-lg); backdrop-filter: blur(18px); }

/* ---------- Drag & Drop Zone ---------- */
.drop-zone { border: 2px dashed var(--saffron); background: linear-gradient(180deg, #FFFDF9 0%, #FFF7ED 100%); border-radius: 18px; padding: 1.4rem 1rem; text-align: center; cursor: pointer; transition: all 0.18s ease; }
.drop-zone.drag-over { border-color: var(--india-green); background: #ECFDF3; transform: scale(1.01); }
.drop-zone-icon { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #FF9933, #EA580C); color: #FFFFFF; display: grid; place-items: center; margin: 0 auto 0.55rem; font-size: 1.35rem; box-shadow: 0 8px 18px rgba(234, 88, 12, 0.25); }

/* ---------- App Shell (Ashoka Navy + Saffron + India Green) ---------- */
.app-layout { min-height: 100vh; display: grid; grid-template-columns: 268px 1fr; background: var(--bg); }
.sidebar {
  background: linear-gradient(180deg, #091E56 0%, #0F2D7A 65%, #071947 100%);
  color: #E2E8F0;
  padding: 1.45rem 1rem 1.2rem;
  display: flex;
  flex-direction: column;
  gap: 1.3rem;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand-lockup { display: flex; align-items: center; gap: 0.78rem; }
.brand-mark { width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #138808 100%); border: 2px solid #FFFFFF; color: var(--chakra-blue); font-weight: 900; display: grid; place-items: center; flex-shrink: 0; }
.brand-title { font-size: 1.15rem; font-weight: 800; color: #FFFFFF; }
.brand-sub { font-size: 0.74rem; color: #FFD29D; font-weight: 600; }

.sidebar-nav { display: flex; flex-direction: column; gap: 0.4rem; flex: 1; }
.nav-item { display: flex; align-items: center; gap: 0.72rem; min-height: 46px; padding: 0.65rem 0.95rem; border-radius: 999px; border: 1px solid transparent; background: transparent; color: #CBD5E1; font-weight: 700; cursor: pointer; text-align: left; transition: all 0.16s ease; }
.nav-item svg { width: 20px; height: 20px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.nav-item:hover { background: rgba(99, 102, 241, 0.2); color: #FFFFFF; }
.nav-item.active { background: linear-gradient(135deg, #6366F1, #4F46E5); color: #FFFFFF; box-shadow: 0 8px 20px rgba(99, 102, 241, 0.38); }
.sidebar-footer { border-top: 1px solid rgba(255, 255, 255, 0.15); padding-top: 1rem; font-size: 0.84rem; }

.main-area { display: flex; flex-direction: column; min-width: 0; }
.topbar { background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); padding: 0.9rem 1.4rem; display: flex; align-items: center; justify-content: space-between; gap: 0.65rem; position: sticky; top: 0; z-index: 20; flex-wrap: wrap; }
.tenant-pill { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.4rem 0.92rem; border-radius: 999px; background: var(--chakra-blue); color: #FFFFFF; font-size: 0.78rem; font-weight: 700; }
.gold-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--saffron); }
.clock-pill { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.36rem 0.78rem; border-radius: 999px; background: #FFF7ED; border: 1px solid #FED7AA; font-size: 0.78rem; font-weight: 700; color: var(--saffron-deep); font-variant-numeric: tabular-nums; }

.content { padding: 1.4rem; max-width: 1280px; width: 100%; margin: 0 auto; }
.mobile-bottom-nav { display: none; }
.mobile-only-signout { display: none; }

.page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.9rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
.page-header h2 { margin: 0; font-size: 1.5rem; color: var(--ink); letter-spacing: -0.02em; }
.page-header p { margin: 0.2rem 0 0; color: var(--ink-muted); font-size: 0.9rem; }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 0.85rem; margin-bottom: 1.25rem; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-top: 4px solid var(--saffron); border-radius: var(--radius); padding: 1rem 1.1rem; box-shadow: var(--shadow-sm); }
.kpi-card:nth-child(even) { border-top-color: var(--india-green); }
.kpi-label { font-size: 0.72rem; font-weight: 700; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.04em; }
.kpi-value { font-size: 1.65rem; font-weight: 800; color: var(--chakra-blue); margin: 0.22rem 0 0.08rem; }
.kpi-sub { font-size: 0.78rem; color: var(--ink-muted); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; box-shadow: var(--shadow-sm); margin-bottom: 1.15rem; }
.card-header { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.95rem; flex-wrap: wrap; }
.card-title { margin: 0; font-size: 1.06rem; font-weight: 800; color: var(--ink); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.1rem; }

.profile-banner { background: linear-gradient(135deg, #0F2D7A 0%, #1E40AF 65%, #138808 125%); color: #FFFFFF; border-radius: 20px; padding: 1.4rem; display: flex; align-items: center; gap: 1.15rem; flex-wrap: wrap; margin-bottom: 1.15rem; box-shadow: 0 12px 30px rgba(15, 45, 122, 0.24); }
.profile-photo { width: 74px; height: 74px; border-radius: 50%; object-fit: cover; border: 3px solid var(--saffron); background: var(--chakra-blue); display: grid; place-items: center; font-size: 1.5rem; font-weight: 800; color: #FFFFFF; flex-shrink: 0; }
.face-thumb { width: 54px; height: 54px; border-radius: 13px; object-fit: cover; border: 2px solid var(--saffron); flex-shrink: 0; }

.badge { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.26rem 0.68rem; border-radius: 999px; font-size: 0.74rem; font-weight: 700; }
.badge-blue { background: var(--chakra-soft); color: var(--chakra-blue); }
.badge-green { background: var(--india-green-soft); color: var(--india-green); border: 1px solid rgba(19, 136, 8, 0.28); }
.badge-amber { background: var(--saffron-soft); color: var(--saffron-deep); border: 1px solid rgba(255, 153, 51, 0.45); }
.badge-red { background: var(--danger-soft); color: var(--danger); }
.badge-navy { background: var(--chakra-blue); color: #FFFFFF; }
.badge-slate { background: #F1F5F9; color: var(--ink-muted); }

.form-group { margin-bottom: 0.85rem; }
.form-label { display: block; font-size: 0.82rem; font-weight: 700; color: var(--ink-muted); margin-bottom: 0.3rem; }
.input, .select, .textarea { width: 100%; min-height: 44px; padding: 0.6rem 0.85rem; border: 1.5px solid var(--border-strong); border-radius: 12px; background: #FFFFFF; color: var(--ink); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--chakra-blue); box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.14); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
th { text-align: left; padding: 0.62rem 0.7rem; border-bottom: 2px solid var(--border); color: var(--ink-light); font-size: 0.74rem; text-transform: uppercase; }
td { padding: 0.65rem 0.7rem; border-bottom: 1px solid var(--border); vertical-align: middle; }

.candidate-item { border: 1.5px solid var(--border); border-radius: 14px; padding: 0.9rem 1rem; background: var(--surface-alt); display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
.candidate-item.selectable { cursor: pointer; transition: all 0.15s ease; }
.candidate-item.selectable:hover { border-color: var(--saffron); background: #FFFBF5; }
.candidate-item input[type="radio"] { width: 20px; height: 20px; accent-color: var(--india-green); flex-shrink: 0; }

.avatar-circle { width: 42px; height: 42px; border-radius: 50%; color: #FFFFFF; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; object-fit: cover; }
.progress-track { width: 100%; height: 10px; border-radius: 999px; background: #E2E8F0; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 999px; transition: width 0.35s ease; }

.alert { padding: 0.78rem 0.95rem; border-radius: 12px; font-size: 0.86rem; margin-bottom: 0.85rem; border: 1px solid transparent; }
.alert-info { background: var(--chakra-soft); color: var(--chakra-blue); border-color: #BFDBFE; }
.alert-success { background: var(--india-green-soft); color: var(--india-green-dark); border-color: #BBF7D0; }
.alert-warning { background: var(--saffron-soft); color: #9A3412; border-color: #FED7AA; }
.alert-danger { background: var(--danger-soft); color: #9F1239; border-color: #FECDD3; }

.face-viewport { position: relative; width: 100%; max-width: 360px; margin: 0 auto; border-radius: 18px; overflow: hidden; background: #071947; aspect-ratio: 4 / 3; border: 3px solid var(--saffron); box-shadow: 0 10px 26px rgba(15, 45, 122, 0.24); transition: border-color 0.2s ease, box-shadow 0.2s ease; }
.face-viewport.state-matched { border-color: var(--india-green); box-shadow: 0 0 0 4px rgba(19, 136, 8, 0.24); }
.face-viewport.state-error { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(190, 18, 60, 0.2); }
.face-viewport video { width: 100%; height: 100%; object-fit: cover; display: block; transform: scaleX(-1); }
.face-overlay-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; transform: scaleX(-1); }
.face-oval-guide { position: absolute; inset: 0; pointer-events: none; display: grid; place-items: center; transition: opacity 0.2s ease; }

/**
 * CampusConnect Automatic Neural Biometric Face Scanner (128-D + Aligned Fallback)
 * Camera-only (no gallery/selfie uploads), auto-scans before submit, blocks multi-face & duplicates.
 */
(function (global) {
  const FACE_API_MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/model/';
  const NEURAL_MATCH_MAX_DIST = 0.56;
  const NEURAL_DUP_MAX_DIST = 0.56;
  const FACE_MATCH_MIN = 0.66;
  const PATCH_MATCH_MIN = 0.64;
  const DUPLICATE_PATCH_MIN = 0.74;
  const DUPLICATE_DESC_MIN = 0.78;

  let detectorReady = false;
  let recognizerReady = false;
  let modelLoadPromise = null;

  function warmupModels() {
    if (detectorReady && recognizerReady) return Promise.resolve(true);
    if (modelLoadPromise) return modelLoadPromise;
    modelLoadPromise = (async () => {
      const deadline = new Promise((res) => setTimeout(() => res('timeout'), 35000));
      const loader = (async () => {
        for (let i = 0; i < 40 && typeof global.faceapi === 'undefined'; i++) {
          await new Promise((r) => setTimeout(r, 150));
        }
        const fa = global.faceapi;
        if (!fa || !fa.nets) return false;
        // Stage 1: tinyFaceDetector (~190KB) loads near-instantly for real-time box & multi-face guard
        if (!detectorReady) {
          await fa.nets.tinyFaceDetector.loadFromUri(FACE_API_MODEL_URL);
          detectorReady = true;
        }
        // Stage 2: 68 landmarks + 128-D face recognition model
        if (!recognizerReady) {
          await Promise.all([
            fa.nets.faceLandmark68TinyNet.loadFromUri(FACE_API_MODEL_URL),
            fa.nets.faceRecognitionNet.loadFromUri(FACE_API_MODEL_URL),
          ]);
          recognizerReady = true;
        }
        return true;
      })().catch(() => false);
      const outcome = await Promise.race([loader, deadline]);
      if (outcome !== true) modelLoadPromise = null;
      return outcome === true;
    })();
    return modelLoadPromise;
  }

  function isDetectorReady() {
    return detectorReady && typeof global.faceapi !== 'undefined';
  }

  function isNeuralReady() {
    return detectorReady && recognizerReady && typeof global.faceapi !== 'undefined';
  }

  async function sha256Hex(text) {
    const data = new TextEncoder().encode(String(text));
    const buf = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(buf))
      .map((b) => b.toString(16).padStart(2, '0'))
      .join('');
  }

  function euclideanDistance(a, b) {
    if (!Array.isArray(a) || !Array.isArray(b) || a.length === 0 || a.length !== b.length) return Infinity;
    let sum = 0;
    for (let i = 0; i < a.length; i++) {
      const d = a[i] - b[i];
      sum += d * d;
    }
    return Math.sqrt(sum);
  }

  function neuralDistToPct(dist) {
    if (!Number.isFinite(dist)) return 0;
    if (dist <= NEURAL_MATCH_MAX_DIST) {
      return Math.max(75, Math.min(99, Math.round(100 - (dist / NEURAL_MATCH_MAX_DIST) * 24)));
    }
    return Math.max(5, Math.min(74, Math.round(74 - ((dist - NEURAL_MATCH_MAX_DIST) / 0.46) * 58)));
  }

  function sampleGrayscalePatch(canvas, rx, ry, rw, rh, outW, outH) {
    const off = document.createElement('canvas');
    off.width = outW;
    off.height = outH;
    const octx = off.getContext('2d', { willReadFrequently: true });
    octx.imageSmoothingEnabled = true;
    octx.imageSmoothingQuality = 'medium';
    octx.drawImage(canvas, rx, ry, rw, rh, 0, 0, outW, outH);
    const data = octx.getImageData(0, 0, outW, outH).data;
    const out = new Array(outW * outH);
    let sum = 0;
    for (let i = 0; i < out.length; i++) {
      const p = i * 4;
      const lum = Math.round(0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2]);
      out[i] = lum;
      sum += lum;
    }
    const mean = sum / out.length;
    let varSum = 0;
    for (let i = 0; i < out.length; i++) {
      const d = out[i] - mean;
      varSum += d * d;
    }
    return { patch: out, meanLum: mean / 255, std: Math.sqrt(varSum / out.length) / 255 };
  }

  function computeEdgePatch(patch, width, height) {
    const edges = new Array(width * height);
    for (let r = 0; r < height; r++) {
      for (let c = 0; c < width; c++) {
        const idx = r * width + c;
        const left = c > 0 ? patch[idx - 1] : patch[idx];
        const right = c + 1 < width ? patch[idx + 1] : patch[idx];
        const up = r > 0 ? patch[idx - width] : patch[idx];
        const down = r + 1 < height ? patch[idx + width] : patch[idx];
        edges[idx] = Math.round(Math.abs(right - left) + Math.abs(down - up));
      }
    }
    return edges;
  }

  function extractGrid60(canvas, rx, ry, rw, rh) {
    const cols = 6;
    const rows = 6;
    const { patch, meanLum, std } = sampleGrayscalePatch(canvas, rx, ry, rw, rh, cols, rows);
    const normGrid = patch.map((v) => v / 255);
    const safeStd = std > 0.01 ? std : 0.01;
    const descriptor = normGrid.map((v) => Number(((v - meanLum) / safeStd).toFixed(4)));
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols - 1; c++) {
        const idx = r * cols + c;
        descriptor.push(Number((((normGrid[idx + 1] - normGrid[idx]) / safeStd) * 0.65).toFixed(4)));
      }
    }
    return { descriptor, meanLum, std };
  }

  function extractLegacy32(canvas, rx, ry, rw, rh) {
    const { patch } = sampleGrayscalePatch(canvas, rx, ry, rw, rh, 8, 4);
    return patch.map((v) => Number((0.15 + (v / 255) * 0.85).toFixed(5)));
  }

  function centeredCosineSimilarity(vecA, vecB) {
    if (!Array.isArray(vecA) || !Array.isArray(vecB) || vecA.length === 0 || vecA.length !== vecB.length) return 0;
    let sumA = 0;
    let sumB = 0;
    for (let i = 0; i < vecA.length; i++) {
      sumA += vecA[i];
      sumB += vecB[i];
    }
    const meanA = sumA / vecA.length;
    const meanB = sumB / vecB.length;
    let dot = 0;
    let magA = 0;
    let magB = 0;
    for (let i = 0; i < vecA.length; i++) {
      const a = vecA[i] - meanA;
      const b = vecB[i] - meanB;
      dot += a * b;
      magA += a * a;
      magB += b * b;
    }
    if (magA === 0 || magB === 0) return 0;
    return dot / (Math.sqrt(magA) * Math.sqrt(magB));
  }

  function bestAlignedCombinedSimilarity(enrolledPatch20, liveSearchPatch28, enrolledEdge20 = null) {
    const ew = 20;
    const eh = 20;
    const sw = 28;
    let best = -1;
    for (let dy = 0; dy <= sw - eh; dy++) {
      for (let dx = 0; dx <= sw - ew; dx++) {
        const sub = new Array(ew * eh);
        for (let r = 0; r < eh; r++) {
          const rowStart = (dy + r) * sw + dx;
          for (let c = 0; c < ew; c++) {
            sub[r * ew + c] = liveSearchPatch28[rowStart + c];
          }
        }
        const lumSim = centeredCosineSimilarity(sub, enrolledPatch20);
        const edgeSim = enrolledEdge20 ? centeredCosineSimilarity(computeEdgePatch(sub, ew, eh), enrolledEdge20) : lumSim;
        const combined = lumSim * 0.55 + edgeSim * 0.45;
        if (combined > best) best = combined;
      }
    }
    return best;
  }

  function verifyFaceIdentity(liveSample, enrolledProfile) {
    if (!liveSample || !enrolledProfile) {
      return { matched: false, scorePct: 0, reason: 'Enrolled face profile not found.' };
    }
    if (liveSample.isPhotoUpload) {
      return { matched: false, scorePct: 0, reason: 'Live camera scan required. Photo uploads are disabled.' };
    }

    const enrolledDesc = enrolledProfile.descriptor || enrolledProfile.faceVec;

    // 1. Primary: Real Neural 128-D Face Recognition distance check
    if (Array.isArray(liveSample.descriptor) && liveSample.descriptor.length === 128 && Array.isArray(enrolledDesc) && enrolledDesc.length === 128) {
      const dist = euclideanDistance(liveSample.descriptor, enrolledDesc);
      const matched = dist <= NEURAL_MATCH_MAX_DIST;
      const scorePct = neuralDistToPct(dist);
      return {
        matched,
        scorePct,
        reason: matched
          ? 'Identity verified'
          : `Face not matched (${scorePct}%). Look directly at the camera in clear light.`,
      };
    }

    // 2. Fallback / Upgrade bridge: Aligned inner-face patch + edge gradients
    if (
      Array.isArray(enrolledProfile.alignedPatch) &&
      enrolledProfile.alignedPatch.length === 400 &&
      Array.isArray(liveSample.searchPatch) &&
      liveSample.searchPatch.length === 784
    ) {
      const enEdge = enrolledProfile.edgePatch || computeEdgePatch(enrolledProfile.alignedPatch, 20, 20);
      const sim = bestAlignedCombinedSimilarity(enrolledProfile.alignedPatch, liveSample.searchPatch, enEdge);
      const matched = sim >= PATCH_MATCH_MIN;
      const scorePct = Math.max(0, Math.min(99, Math.round(sim * 100)));
      return {
        matched,
        scorePct,
        reason: matched
          ? 'Identity verified'
          : `Face mismatch (${scorePct}% similarity). Keep your face centered inside the oval.`,
      };
    }

    // 3. 60-d / 32-d vector compatibility
    if (Array.isArray(enrolledDesc) && enrolledDesc.length === 60 && Array.isArray(liveSample.shiftedDescriptors)) {
      let best = -1;
      for (const cand of liveSample.shiftedDescriptors) {
        const sim = centeredCosineSimilarity(cand, enrolledDesc);
        if (sim > best) best = sim;
      }
      const matched = best >= FACE_MATCH_MIN;
      const scorePct = Math.max(0, Math.min(99, Math.round(best * 100)));
      return {
        matched,
        scorePct,
        reason: matched ? 'Identity verified' : `Face mismatch (${scorePct}%). Keep face steady in camera.`,
      };
    }

    if (Array.isArray(enrolledDesc) && enrolledDesc.length === 32 && Array.isArray(liveSample.legacy32)) {
      const sim = centeredCosineSimilarity(liveSample.legacy32, enrolledDesc);
      const matched = sim >= 0.72;
      const scorePct = Math.max(0, Math.min(99, Math.round(sim * 100)));
      return {
        matched,
        scorePct,
        reason: matched ? 'Identity verified' : `Face mismatch (${scorePct}%). Ask Host to request biometric update.`,
      };
    }

    if (Array.isArray(enrolledDesc) && Array.isArray(liveSample.descriptor) && enrolledDesc.length === liveSample.descriptor.length) {
      const sim = centeredCosineSimilarity(liveSample.descriptor, enrolledDesc);
      const matched = sim >= FACE_MATCH_MIN;
      const scorePct = Math.max(0, Math.min(99, Math.round(sim * 100)));
      return {
        matched,
        scorePct,
        reason: matched ? 'Identity verified' : `Face mismatch (${scorePct}%). Center your face clearly.`,
      };
    }

    return {
      matched: false,
      scorePct: 0,
      reason: 'Stored biometric needs an update. Ask Host to click Request Biometric.',
    };
  }

  function findDuplicateFace(candidateSampleOrProfile, existingEntries, ownUid = '') {
    const candDesc = candidateSampleOrProfile?.descriptor || candidateSampleOrProfile?.faceVec;
    const candSearchPatch = candidateSampleOrProfile?.searchPatch;
    const candAlignedPatch = candidateSampleOrProfile?.alignedPatch;

    for (const entry of existingEntries || []) {
      if (!entry || (ownUid && (entry.uid === ownUid || entry.id === ownUid))) continue;
      if (entry.role === 'host') continue;

      const entryDesc = entry.descriptor || entry.faceVec;

      // 1. Neural 128-D duplicate face check
      if (Array.isArray(candDesc) && candDesc.length === 128 && Array.isArray(entryDesc) && entryDesc.length === 128) {
        const dist = euclideanDistance(candDesc, entryDesc);
        if (dist <= NEURAL_DUP_MAX_DIST) {
          return {
            isDuplicate: true,
            matchedUid: entry.uid || entry.id,
            matchedEmail: entry.email || '',
            matchedName: entry.fullName || entry.email || 'Existing Student',
            similarityPct: neuralDistToPct(dist),
          };
        }
      }

      // 2. Sliding alignedPatch check

  async function submitStudentOnboarding({ invite, fullName, bio, personalPassword, capturedFace }) {
    const { auth, db } = getBackend();
    const cleanEmail = invite.email.trim().toLowerCase();
    let cred;
    let createdNewAuthUser = false;

    try {
      cred = await auth.createUserWithEmailAndPassword(cleanEmail, personalPassword);
      createdNewAuthUser = true;
    } catch (err) {
      if (err?.code === 'auth/email-already-in-use') {
        try {
          cred = await auth.signInWithEmailAndPassword(cleanEmail, personalPassword);
        } catch {
          const e = new Error(
            'This email already has an account with a different password. Enter your previous password OR click "Send Password Reset" below.'
          );
          e.needsPasswordReset = true;
          throw e;
        }
      } else {
        throw new Error(formatError(err));
      }
    }

    const uid = cred.user.uid;
    const nowIso = new Date().toISOString();

    try {
      // 1. Ensure user doc exists (with faceVec + alignedPatch so duplicate checks work on users collection!)
      const userRef = db.collection('users').doc(uid);
      const existingUserSnap = await userRef.get();
      if (!existingUserSnap.exists) {
        await userRef.set({
          uid,
          communityId: invite.communityId,
          classroomId: invite.classroomId,
          email: cleanEmail,
          fullName: fullName.trim(),
          bio: bio.trim() || 'Student Member',
          avatarDataUrl: capturedFace.snapshotDataUrl,
          faceVec: capturedFace.descriptor,
          alignedPatch: capturedFace.alignedPatch || null,
          role: 'student',
          faceEnrolled: true,
          faceConsent: true,
          hostApproved: false,
          onboardingStatus: 'pending_host_approval',
          createdAt: nowIso,
        });
      } else {
        await userRef.update({
          fullName: fullName.trim(),
          bio: bio.trim() || 'Student Member',
          avatarDataUrl: capturedFace.snapshotDataUrl,
          faceVec: capturedFace.descriptor,
          alignedPatch: capturedFace.alignedPatch || null,
          faceEnrolled: true,
          faceConsent: true,
          onboardingStatus: 'pending_host_approval',
        });
      }

      // 2. Check community-wide duplicate faces across BOTH users & face_signatures (cannot be bypassed!)
      try {
        await assertNoDuplicateFace(db, invite.communityId, capturedFace, uid);
      } catch (dupErr) {
        if (createdNewAuthUser) {
          await userRef.delete().catch(() => {});
          await cred.user.delete().catch(() => {});
        }
        throw dupErr;
      }

      // 3. Commit core Host approval request (face_profiles + student_invites) in atomic batch
      const batch = db.batch();
      batch.set(db.collection('face_profiles').doc(uid), {
        uid,
        communityId: invite.communityId,
        email: cleanEmail,
        fullName: fullName.trim(),
        descriptor: capturedFace.descriptor,
        alignedPatch: capturedFace.alignedPatch || null,
        snapshotDataUrl: capturedFace.snapshotDataUrl,
        livenessDelta: capturedFace.livenessDelta,
        submittedAt: nowIso,
      });

      batch.update(db.collection('student_invites').doc(cleanEmail), {
        onboardingStatus: 'pending_host_approval',
        studentUid: uid,
        fullName: fullName.trim(),
        submittedAt: nowIso,
      });

      await batch.commit();

      // 4. Write face_signatures non-blockingly so older rule deployments still pass step 3 cleanly
      db.collection('face_signatures')
        .doc(`${invite.communityId}_${uid}`)
        .set({
          uid,
          communityId: invite.communityId,
          email: cleanEmail,
          fullName: fullName.trim(),
          descriptor: capturedFace.descriptor,
          submittedAt: nowIso,
        })
        .catch(() => {});

      queueAudit(db, {
        communityId: invite.communityId,
        actorUid: uid,
        actorRole: 'student',
        actorName: fullName.trim(),
        action: 'STUDENT_FACE_SCAN_SUBMITTED',
        targetType: 'user',
        targetId: uid,
        details: { email: cleanEmail },
      });

      await auth.signOut();
      return { email: cleanEmail, onboardingStatus: 'pending_host_approval' };
    } catch (err) {
      // Clean rollback if this submission created a brand new auth user and failed mid-way
      if (createdNewAuthUser) {
        try {
          await db.collection('users').doc(uid).delete().catch(() => {});
          await cred.user.delete().catch(() => {});
        } catch {
          // ignore
        }
      }
      await auth.signOut().catch(() => {});
      throw new Error(formatError(err));
    }
  }

  async function loadWorkspace(user) {
    const { db } = getBackend();
    const commId = user.communityId;
    const isHost = user.role === 'host';
    const commRef = db.collection('communities').doc(commId);

    const basePromises = [
      commRef.get(),
      commRef.collection('classrooms').get(),
      commRef.collection('announcements').get(),
      commRef.collection('activities').get(),
      db.collection('users').where('communityId', '==', commId).get(),
      db.collection('elections').where('communityId', '==', commId).get(),
    ];

    if (isHost) {
      basePromises.push(
        db.collection('student_invites').where('communityId', '==', commId).get(),
        db.collection('face_profiles').where('communityId', '==', commId).get(),
        db.collection('audit_logs').where('communityId', '==', commId).get()
      );
    }

    const results = await Promise.all(basePromises);
    const [commSnap, clsSnap, annSnap, actSnap, usersSnap, electionsSnap] = results;

    const community = commSnap.exists ? { id: commSnap.id, ...commSnap.data() } : null;
    const classrooms = clsSnap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    const announcements = annSnap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
    const activities = actSnap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
    const users = usersSnap.docs.map((d) => ({ id: d.id, ...d.data() }));

    let invites = [];
    let faceProfiles = {};
    let auditLogs = [];

    if (isHost) {
      invites = dedupeInvites(results[6].docs.map((d) => ({ id: d.id, ...d.data() })));
      results[7].docs.forEach((d) => {
        faceProfiles[d.id] = d.data();
      });
      auditLogs = results[8].docs.map((d, i) => ({ id: d.id, seq: i + 1, ...d.data() })).sort((a, b) => (a.createdAtMs || 0) - (b.createdAtMs || 0));
    }

    const elections = [];
    const nominationsByElection = {};
    const participationByElection = {};
    const resultsByElection = {};

    await Promise.all(
      electionsSnap.docs.map(async (eDoc) => {
        const raw = eDoc.data();
        const el = {
          id: eDoc.id,
          ...raw,
          startAtMs: toMillis(raw.startAt),
          endAtMs: toMillis(raw.endAt),
        };
        el.status = deriveElectionStatus({ ...el, startAt: el.startAtMs, endAt: el.endAtMs });
        elections.push(el);

        const elRef = db.collection('elections').doc(el.id);

        if (isHost) {
          const [nomSnap, vpSnap, ballotsSnap] = await Promise.all([
            elRef.collection('nominations').get(),
            elRef.collection('voter_participation').get(),
            elRef.collection('ballots').get(),
          ]);
          nominationsByElection[el.id] = nomSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
          participationByElection[el.id] = vpSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
          resultsByElection[el.id] = computeTallies(nominationsByElection[el.id], ballotsSnap.docs.map((d) => d.data()));
        } else {
          const reqs = [
            elRef.collection('nominations').get(),
            elRef.collection('voter_participation').doc(user.uid).get(),
          ];
          if (el.resultsPublished === true) {
            reqs.push(elRef.collection('results').doc('official').get());
          }
          const [nomSnap, vpSnap, resSnap] = await Promise.all(reqs);
          nominationsByElection[el.id] = nomSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
          participationByElection[el.id] = vpSnap.exists ? [{ id: vpSnap.id, ...vpSnap.data() }] : [];
          if (el.resultsPublished === true && resSnap) {
            resultsByElection[el.id] = resSnap.exists ? resSnap.data().rows || [] : [];
          }
        }
      })
    );

    elections.sort((a, b) => b.startAtMs - a.startAtMs);

    return {
      community,
      classrooms,
      announcements,
      activities,
      users,
      invites,
      faceProfiles,
      elections,
      nominationsByElection,
      participationByElection,
      resultsByElection,
      auditLogs,
    };
  }

  function computeTallies(nominations, ballots) {
    const approvedNoms = (nominations || []).filter((n) => n.status === 'approved');
    const total = (ballots || []).length;
    const countMap = new Map();
    for (const b of ballots || []) {
      countMap.set(b.nominationId, (countMap.get(b.nominationId) || 0) + 1);
    }
    const maxVotes = approvedNoms.reduce((m, n) => Math.max(m, countMap.get(n.id) || 0), 0);
    return approvedNoms
      .map((n) => {
        const vc = countMap.get(n.id) || 0;
        const pct = total > 0 ? Number(((vc / total) * 100).toFixed(1)) : 0;
        return {
          nominationId: n.id,
          fullName: n.fullName,
          classroomName: n.classroomName,
          badgeColor: n.badgeColor || '#0F2D7A',
          photoDataUrl: n.photoDataUrl || '',
          voteCount: vc,
          percentage: pct,
          isWinner: total > 0 && vc === maxVotes,
        };
      })
      .sort((a, b) => b.voteCount - a.voteCount);
  }

  async function addStudentEmails(hostUser, comm, classrooms, rows, existingInvites = []) {
    const { db } = getBackend();
    const nowIso = new Date().toISOString();
    const existingSet = new Set((existingInvites || []).map((i) => i.email.toLowerCase()));
    try {
      const snap = await db.collection('student_invites').where('communityId', '==', comm.id).get();
      for (const doc of snap.docs) {
        existingSet.add(String(doc.data()?.email || doc.id || '').trim().toLowerCase());
      }
    } catch {
      // Fallback to caller-provided existingInvites set if query fails
    }
    const batch = db.batch();
    const createdInvites = [];

    for (const row of rows) {
      const cleanEmail = row.email.trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanEmail)) {
        throw new Error(`Invalid email address: '${cleanEmail || 'empty'}'`);
      }
      if (existingSet.has(cleanEmail)) continue;
      existingSet.add(cleanEmail);

      const cls =
        classrooms.find((c) => c.id === row.classroomId) ||
        classrooms.find((c) => c.name.toLowerCase() === String(row.classroomName || '').trim().toLowerCase()) ||
        classrooms[0];
      if (!cls) throw new Error('Create a classroom first.');

      const inviteObj = {
        id: cleanEmail,
        email: cleanEmail,
        communityId: comm.id,
        communityName: comm.name,
        classroomId: cls.id,
        classroomName: cls.name,
        hostUid: hostUser.uid,
        onboardingStatus: 'awaiting_face_scan',
        studentUid: null,
        fullName: '',
        createdAt: nowIso,
      };
      batch.set(db.collection('student_invites').doc(cleanEmail), inviteObj);
      createdInvites.push(inviteObj);
    }

    if (createdInvites.length === 0) return [];

    await batch.commit();
    queueAudit(db, {
      communityId: comm.id,
      actorUid: hostUser.uid,
      actorRole: 'host',
      actorName: hostUser.fullName,
      action: 'STUDENT_EMAILS_ADDED',
      targetType: 'community',
      targetId: comm.id,
      details: { addedCount: createdInvites.length },
    });
    return createdInvites;
  }

  async function removeStudentInvite(commId, email, studentUid) {
    const { db } = getBackend();
    const cleanEmail = String(email || '').trim().toLowerCase();
    const uidsToDelete = new Set();
    if (studentUid) uidsToDelete.add(studentUid);

    const [usersSnap, fpSnap, sigSnap] = await Promise.all([
      db.collection('users').where('communityId', '==', commId).get().catch(() => ({ docs: [] })),
      db.collection('face_profiles').where('communityId', '==', commId).get().catch(() => ({ docs: [] })),
      db.collection('face_signatures').where('communityId', '==', commId).get().catch(() => ({ docs: [] })),
    ]);

    const extraDeletes = [];
    for (const d of usersSnap.docs) {
      const data = d.data() || {};
      if (String(data.email || '').trim().toLowerCase() === cleanEmail || d.id === studentUid) {
        uidsToDelete.add(d.id);
        extraDeletes.push(db.collection('users').doc(d.id).delete().catch(() => {}));
      }
    }
    for (const d of fpSnap.docs) {
      const data = d.data() || {};
      if (String(data.email || '').trim().toLowerCase() === cleanEmail || uidsToDelete.has(d.id)) {
        uidsToDelete.add(d.id);
        extraDeletes.push(db.collection('face_profiles').doc(d.id).delete().catch(() => {}));
      }
    }
    for (const d of sigSnap.docs) {
      const data = d.data() || {};
      if (String(data.email || '').trim().toLowerCase() === cleanEmail || uidsToDelete.has(data.uid)) {
        extraDeletes.push(db.collection('face_signatures').doc(d.id).delete().catch(() => {}));
      }
    }

    const batch = db.batch();
    batch.delete(db.collection('student_invites').doc(cleanEmail));
    for (const uid of uidsToDelete) {
      batch.delete(db.collection('users').doc(uid));
      batch.delete(db.collection('face_profiles').doc(uid));
      batch.delete(db.collection('face_signatures').doc(`${commId}_${uid}`));
    }
    await batch.commit();
    await Promise.all(extraDeletes);
    return Array.from(uidsToDelete);
  }

  async function assertNoDuplicateFace(db, communityId, capturedFace, excludeUid) {
    const [invSnap, usersSnap, sigSnap] = await Promise.all([
      db.collection('student_invites').where('communityId', '==', communityId).get().catch(() => ({ docs: [] })),
      db.collection('users').where('communityId', '==', communityId).get().catch(() => ({ docs: [] })),
      db.collection('face_signatures').where('communityId', '==', communityId).get().catch(() => ({ docs: [] })),
    ]);
    const hasInviteFilter = invSnap.docs && invSnap.docs.length > 0;
    const activeEmails = new Set(
      (invSnap.docs || []).map((d) => String(d.data()?.email || d.id || '').trim().toLowerCase()).filter(Boolean)
    );
    const rawEntries = [
      ...usersSnap.docs.map((d) => ({ id: d.id, ...d.data() })),
      ...sigSnap.docs.map((d) => d.data()),
    ];
    const combinedEntries = hasInviteFilter
      ? rawEntries.filter((e) => !e.email || activeEmails.has(String(e.email).trim().toLowerCase()))
      : rawEntries;
    const dup = global.CampusFace.findDuplicateFace(capturedFace, combinedEntries, excludeUid);
    if (dup.isDuplicate) {
      throw new Error(
        `Duplicate face rejected (${dup.similarityPct}% match with ${dup.matchedName} / ${dup.matchedEmail}). Same face cannot be used for two accounts.`
      );
    }
  }

    const cur = snap.data() || {};
    const comments = Array.isArray(cur.comments) ? cur.comments.slice() : [];
    const comment = {
      id: randomHex(6),
      uid,
      authorName: String(authorName || 'Member').trim(),
      role: role || 'student',
      text: cleanText,
      createdAt: new Date().toISOString(),

    const { db } = getBackend();
    if (!startMs || !endMs || endMs <= startMs) {
      throw new Error('End date & time must be after Start date & time.');
    }
    const Timestamp = global.firebase.firestore.Timestamp;
    const now = Date.now();
    const status = startMs <= now && endMs > now ? 'active' : startMs > now ? 'scheduled' : 'closed';
    await db.collection('elections').doc(electionId).update({
      startAt: Timestamp.fromMillis(startMs),
      endAt: Timestamp.fromMillis(endMs),
      status,
      resultsReady: status === 'closed',
    });
    return { startAtMs: startMs, endAtMs: endMs, status };

    const payload = {

      communityId: commId,
      title: title.trim(),
      position: position.trim(),
      description: description.trim(),
      startAt: Timestamp.fromMillis(effectiveStartMs),
      endAt: Timestamp.fromMillis(endMs),
      status: effectiveStartMs <= Date.now() ? 'active' : 'scheduled',
      eligibleClassroomIds,
      resultsReady: false,
      resultsPublished: false,
      createdAt: new Date().toISOString(),
    };

    const { db } = getBackend();
    const elRef = db.collection('elections').doc(election.id);
    const ballotsSnap = await elRef.collection('ballots').get();
    const ballots = ballotsSnap.docs.map((d) => d.data());
    const rows = computeTallies(nominations, ballots);
    const publishedAt = Date.now();

    const batch = db.batch();
    batch.set(elRef.collection('results').doc('official'), {
      electionId: election.id,
      communityId: commId,
      rows,
      totalVotes: ballots.length,
      publishedAt,
    });
    batch.update(elRef, {
      status: 'closed',
      resultsReady: true,
      resultsPublished: true,
      publishedAt,

    await batch.commit();

    queueAudit(db, {

      actorRole: 'host',
      actorName: hostUser.fullName,

  async function castFaceVerifiedVote({ user, election, nominationId, liveSample, prefetchedFace }) {
    const { db } = getBackend();
    const enrolled = prefetchedFace || (await fetchFaceProfile(user.uid));
    if (!enrolled) throw new Error('Enrolled face profile not found.');
    if (!liveSample || liveSample.isPhotoUpload) throw new Error('Live webcam face scan required.');

    const verification = global.CampusFace.verifyFaceIdentity(liveSample, enrolled);
    if (!verification.matched) {
      throw new Error(verification.reason);
    }

    const elRef = db.collection('elections').doc(election.id);
    const vpRef = elRef.collection('voter_participation').doc(user.uid);
    const ballotRef = elRef.collection('ballots').doc();

    const receipt = randomHex(8).toUpperCase();
    const castAt = Date.now();
    const ballotHash = await sha256({ electionId: election.id, nominationId, castAt, nonce: randomHex(8) });

    const batch = db.batch();
    batch.set(vpRef, {
      electionId: election.id,
      studentUid: user.uid,
      classroomId: user.classroomId,
      receiptHash: receipt,
      votedAt: castAt,
    });
    batch.set(ballotRef, {
      communityId: user.communityId,
      electionId: election.id,
      nominationId,
      castAt,
      ballotHash,
    });
    try {
      await batch.commit();
    } catch (err) {
      throw new Error(formatError(err, 'vote'));
    }

    queueAudit(db, {
      communityId: user.communityId,
      actorUid: user.uid,
      actorRole: 'student',
      actorName: user.fullName,
      action: 'FACE_VERIFIED_VOTE_CAST',
      targetType: 'election',
      targetId: election.id,
      details: { receiptHash: receipt },
    });

    return { receipt, similarityPct: verification.scorePct };
  }

  function dedupeParsedRows(rows) {
    const seen = new Set();
    const out = [];
    for (const r of rows) {
      const em = String(r.email || '').trim().toLowerCase();
      if (!em || seen.has(em)) continue;
      seen.add(em);
      out.push({ ...r, email: em, tempId: out.length + 1 });
    }
    return out;
  }

  function parseEmailFile(rawText, defaultClassroomName = '') {
    const trimmed = String(rawText || '').trim();
    if (!trimmed) return [];

    if (trimmed.startsWith('[') || trimmed.startsWith('{')) {
      try {
        const parsed = JSON.parse(trimmed);
        if (Array.isArray(parsed)) {
          return dedupeParsedRows(
            parsed.map((item, idx) => ({
              tempId: idx + 1,
              email: typeof item === 'string' ? item.trim().toLowerCase() : String(item.email || '').trim().toLowerCase(),
              classroomName: typeof item === 'object' ? String(item.classroomName || item.classroom || item.class || defaultClassroomName).trim() : defaultClassroomName,
            }))
          );
        }
      } catch {
        // fall through
      }
    }

    const lines = trimmed.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    const rows = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (i === 0 && /email/i.test(line) && !line.includes('@')) continue;
      const tokens = line.split(/[,\t;|]+/).map((p) => p.trim().replace(/^["']|["']$/g, '')).filter(Boolean);
      const allAreEmails = tokens.length > 1 && tokens.every((t) => t.includes('@'));
      if (allAreEmails) {
        for (const em of tokens) {
          rows.push({ tempId: rows.length + 1, email: em.toLowerCase(), classroomName: defaultClassroomName });
        }
      } else {
        const email = (tokens[0] || '').toLowerCase();
        const maybeClass = tokens[1] && !tokens[1].includes('@') ? tokens[1] : (tokens[2] || defaultClassroomName);
        rows.push({ tempId: rows.length + 1, email, classroomName: maybeClass || defaultClassroomName });
      }
    }
    return dedupeParsedRows(rows);
  }

      const reader = new FileReader();

            ctx.lineTo(m.x, m.y);
            ctx.strokeStyle = `rgba(15, 45, 122, ${(1 - dist / 115) * 0.14})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }
      rafId = requestAnimationFrame(tick);
    };
    tick();

    state.bgAnimCleanup = () => {
      if (rafId) cancelAnimationFrame(rafId);
      window.removeEventListener('resize', resize);
    };
  }

  function stopHostSync() {
    if (state.hostInvitesUnsub) {
      try {
        state.hostInvitesUnsub();
      } catch {
        // ignore
      }
      state.hostInvitesUnsub = null;
    }
    if (state.annUnsub) {
      try {
        state.annUnsub();
      } catch {
        // ignore
      }
      state.annUnsub = null;
    }
  }

  function startAnnouncementsSync(commId) {
    if (state.annUnsub) {
      try { state.annUnsub(); } catch {}
      state.annUnsub = null;
    }
    if (!commId) return;
    state.annUnsub = Store.subscribeAnnouncements(commId, (items) => {
      if (!state.ws || !state.sessionUser) return;
      state.ws.announcements = items;
      render();
    });
  }

  function startHostSync(user, commId) {
    stopHostSync();
    if (!user || !commId) return;
    startAnnouncementsSync(commId);
    if (user.role !== 'host') return;
    state.hostInvitesUnsub = Store.subscribeHostInvites(commId, async (invites) => {
      if (!state.ws || !state.sessionUser || state.sessionUser.role !== 'host') return;
      state.ws.invites = invites;
      // Fetch face profiles for any newly submitted pending students
      const missingUids = invites.filter((i) => i.studentUid && !state.ws.faceProfiles[i.studentUid]).map((i) => i.studentUid);
      if (missingUids.length > 0) {
        await Promise.all(
          missingUids.map(async (uid) => {
            const fp = await Store.fetchFaceProfile(uid).catch(() => null);
            if (fp) state.ws.faceProfiles[uid] = fp;
          })
        );
      }
      if (state.activeTab === 'host' || state.activeTab === 'requests') render();
    });
  }

  async function refreshWorkspace() {
    if (!state.sessionUser) return;
    state.ws = await Store.loadWorkspace(state.sessionUser);
    render();
  }

  function warmFaceProfile(user) {
    if (!user || user.role !== 'student') return;
    Store.fetchFaceProfile(user.uid)
      .then((fp) => {
        if (fp) state.prefetchedFace = fp;
      })
      .catch(() => {});
  }

  function setupAuthListener() {
    if (state.authUnsub) {
      state.authUnsub();
      state.authUnsub = null;
    }

    const init = Config.initFirebase();
    if (!init.ready) {
      state.isBooting = false;
      render();
      return;
    }

    state.authUnsub = Store.subscribeAuth(async (fbUser) => {
      // Skip intermediate auth events triggered while form submission owns the transition
      if (state.authBusy) return;
      try {
        if (!fbUser) {
          state.sessionUser = null;
          state.ws = null;
          state.prefetchedFace = null;
          state.isBooting = false;
          render();
          return;
        }
        const userDoc = await Store.getUserDoc(fbUser.uid);
        if (!userDoc || (userDoc.role === 'student' && (!userDoc.hostApproved || userDoc.onboardingStatus !== 'approved'))) {
          state.sessionUser = null;
          state.ws = null;
          state.isBooting = false;
          render();
          return;
        }
        state.sessionUser = userDoc;
        state.activeTab = userDoc.role === 'host' ? 'host' : 'elections';
        warmFaceProfile(userDoc);
        state.ws = await Store.loadWorkspace(userDoc);
        startHostSync(userDoc, userDoc.communityId);
        state.isBooting = false;
        render();
      } catch (err) {
        state.isBooting = false;
        toast(Store.formatError(err), 'error');
        render();
      }
    });
  }

  // Live countdown ticker
  setInterval(() => {
    const now = Date.now();
    const clk = document.getElementById('live-clock-text');
    if (clk) clk.textContent = new Date(now).toLocaleTimeString();

    let needRefresh = false;
    document.querySelectorAll('[data-cd-end]').forEach((el) => {
      const startAt = Number(el.getAttribute('data-cd-start'));
      const endAt = Number(el.getAttribute('data-cd-end'));
      const status = el.getAttribute('data-cd-status');
      if (status === 'scheduled') {
        const rem = startAt - now;
        if (rem <= 0) needRefresh = true;
        else el.textContent = `Opens in ${formatDuration(rem)}`;
      } else if (status === 'active') {
        const rem = endAt - now;
        if (rem <= 0) needRefresh = true;
        else el.textContent = `Closes in ${formatDuration(rem)}`;
      }
    });
    if (needRefresh && state.sessionUser && state.ws) {
      state.ws.elections.forEach((el) => {
        el.status = Store.deriveElectionStatus({ ...el, startAt: el.startAtMs, endAt: el.endAtMs });

      render();
    }
  }, 1000);
