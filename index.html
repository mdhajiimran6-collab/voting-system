    startLoginBgAnimation();
    document.getElementById('landing-install-btn')?.addEventListener('click', triggerInstallApp);

    const obSubmitBtn = document.getElementById('ob-submit-btn');
    const cam = Face.mountAutoFaceScanner({
      viewportEl: document.getElementById('ob-viewport'),
      videoEl: document.getElementById('ob-video'),
      overlayEl: document.getElementById('ob-overlay'),
      statusEl: document.getElementById('ob-cam-status'),
      mode: 'enroll',
      onReady: (sample) => {
        state.capturedFace = sample;
        if (obSubmitBtn) {
          obSubmitBtn.disabled = false;
          obSubmitBtn.textContent = 'Submit to Host ✓';
        }
      },
    });
    state.camCleanup = cam.stop;

    document.getElementById('ob-rescan-btn').addEventListener('click', () => {
      state.capturedFace = null;
      if (obSubmitBtn) {
        obSubmitBtn.disabled = true;
        obSubmitBtn.textContent = 'Scanning Face...';
      }
      cam.rescan();
    });
    document.getElementById('ob-retry-cam').addEventListener('click', () => {
      state.capturedFace = null;
      if (obSubmitBtn) {
        obSubmitBtn.disabled = true;
        obSubmitBtn.textContent = 'Scanning Face...';
      }
      cam.retryCamera();
    });

    document.getElementById('ob-back').addEventListener('click', () => {
      stopCamera();
      state.onboardingInvite = null;
      render();
    });

    document.getElementById('onboarding-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!state.capturedFace) {
        toast('Please keep your face centered in the camera until scanning completes.', 'error');
        return;
      }
      const newPass = document.getElementById('ob-pass').value;
      const confPass = document.getElementById('ob-pass2').value;
      if (newPass.length < 8) {
        toast('Password must be at least 8 characters.', 'error');
        return;
      }
      if (newPass !== confPass) {
        toast('Passwords do not match.', 'error');
        return;
      }

      const btn = document.getElementById('ob-submit-btn');
      btn.disabled = true;
      btn.textContent = 'Submitting...';
      state.authBusy = true;
      try {
        await Store.submitStudentOnboarding({
          invite,
          fullName: document.getElementById('ob-name').value.trim(),
          bio: document.getElementById('ob-bio').value.trim(),
          personalPassword: newPass,
          capturedFace: state.capturedFace,
        });
        stopCamera();
        state.onboardingInvite = null;
        state.studentLookupInvite = { ...invite, onboardingStatus: 'pending_host_approval' };
        toast('Profile & face scan submitted! Wait for Host approval.', 'success');
        render();
      } catch (err) {
        const msg = Store.formatError(err);
        const errWrap = document.getElementById('ob-error-wrap');
        if (errWrap) {
          errWrap.style.display = 'block';
          const showReset = msg.toLowerCase().includes('password') && msg.toLowerCase().includes('already');
          errWrap.innerHTML = `
            <div class="alert alert-danger" style="margin-bottom:0.5rem;">${escapeHtml(msg)}</div>
            ${showReset ? `<button type="button" class="btn btn-outline btn-sm" id="ob-reset-pass">Send Password Reset Email to ${escapeHtml(invite.email)}</button>` : ''}
          `;
          document.getElementById('ob-reset-pass')?.addEventListener('click', async (ev) => {
            ev.target.disabled = true;
            try {
              await Store.sendPasswordReset(invite.email);
              toast(`Password reset link sent to ${invite.email}! Set a new password in your email, then enter it here.`, 'success');
            } catch (resetErr) {
              toast(Store.formatError(resetErr), 'error');
            } finally {
              ev.target.disabled = false;
            }
          });
        }
        toast(msg, 'error');
      } finally {
        state.authBusy = false;
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Submit to Host';
        }
      }
    });
  }

  // ---------- Main Authenticated Workspace ----------

  function renderWorkspace() {
    stopBgAnim();
    stopCamera();
    const user = state.sessionUser;
    const ws = state.ws;
    if (!user || !ws || !ws.community) {
      renderLanding();
      return;
    }

    const comm = ws.community;
    const isHost = user.role === 'host';
    const pendingNomCount = isHost
      ? Object.values(ws.nominationsByElection || {}).flat().filter((n) => n.status === 'pending').length
      : 0;
    const pendingFaceCount = isHost
      ? (ws.invites || []).filter((i) => i.onboardingStatus === 'pending_host_approval').length
      : 0;
    const reqBadgeCount = isHost
      ? pendingNomCount + pendingFaceCount
      : user.biometricUpdateRequested
      ? 1
      : 0;

    const tabs = isHost
      ? [
          { id: 'host', label: 'Classrooms', short: 'Classes', icon: '🏫' },
          { id: 'requests', label: `Requests${reqBadgeCount ? ` (${reqBadgeCount})` : ''}`, short: 'Requests', icon: '🔔' },
          { id: 'notices', label: 'Notices & Likes', short: 'Notices', icon: '💬' },
          { id: 'elections', label: 'Elections', short: 'Elections', icon: '🗳' },
          { id: 'results', label: 'Results', short: 'Results', icon: '📊' },
          { id: 'profile', label: 'Settings', short: 'Settings', icon: '⚙️' },
        ]
      : [
          { id: 'classroom', label: 'Classroom', short: 'Class', icon: '🏫' },
          { id: 'requests', label: `Requests${reqBadgeCount ? ` (${reqBadgeCount})` : ''}`, short: 'Requests', icon: '🔔' },
          { id: 'notices', label: 'Notices & Likes', short: 'Notices', icon: '💬' },
          { id: 'elections', label: 'Vote', short: 'Vote', icon: '🗳' },
          { id: 'results', label: 'Results', short: 'Results', icon: '📊' },
          { id: 'profile', label: 'Settings', short: 'Settings', icon: '⚙️' },
        ];

    if (!tabs.some((t) => t.id === state.activeTab)) state.activeTab = tabs[0].id;

    let bodyHtml = '';
    if (state.activeTab === 'host') bodyHtml = renderHostClassrooms(ws, user, comm);
    else if (state.activeTab === 'classroom') bodyHtml = renderStudentClassroom(ws, user, comm);
    else if (state.activeTab === 'requests') bodyHtml = renderRequestsPage(ws, user, comm);
    else if (state.activeTab === 'notices') bodyHtml = renderNoticesPage(ws, user, comm);
    else if (state.activeTab === 'elections') bodyHtml = renderElections(ws, user, comm);
    else if (state.activeTab === 'results') bodyHtml = renderResults(ws, user, comm);
    else if (state.activeTab === 'profile') bodyHtml = renderProfileTab(ws, user, comm);

    const cls = ws.classrooms.find((c) => c.id === user.classroomId);

    document.getElementById('app').innerHTML = `
      <div class="app-layout">
        <aside class="sidebar">
          <div class="brand-lockup">
            ${renderCommunityLogoHtml(comm, 44)}
            <div>
              <div class="brand-title">${escapeHtml(comm.name)}</div>
              <div class="brand-sub">${isHost ? 'Host Command' : 'Student Portal'}</div>
            </div>
          </div>
          <nav class="sidebar-nav">
            ${tabs.map((t) => `<button class="nav-item ${state.activeTab === t.id ? 'active' : ''}" data-tab="${t.id}">${TAB_SVGS[t.id] || ''} <span>${escapeHtml(t.label)}</span></button>`).join('')}
          </nav>
          <div class="sidebar-footer">
            <div style="font-weight:700; color:#FFFFFF;">${escapeHtml(user.fullName)}</div>
            <div style="color:#FFD29D; margin-bottom:0.55rem;">${isHost ? 'Community Host' : escapeHtml(cls?.name || 'Student')}</div>
            <button class="btn btn-glass btn-sm" style="width:100%;" id="logout-btn">Sign Out</button>
          </div>
        </aside>

        <div class="main-area">
          <header class="topbar">
            <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
              <span class="tenant-pill" style="padding-left:0.42rem;">${renderCommunityLogoHtml(comm, 24, 'border-radius:50%;')}${escapeHtml(comm.name)}</span>
              <span class="clock-pill"><span id="live-clock-text">${escapeHtml(new Date().toLocaleTimeString())}</span></span>
            </div>
            <div style="display:flex; gap:0.45rem; align-items:center; flex-wrap:wrap;">
              ${!state.isStandalone ? `<button class="btn btn-gold btn-sm" id="pwa-install-btn">📲 App</button>` : ''}
              <button class="btn btn-outline btn-sm" id="sync-ws-btn">Refresh</button>
              <button class="btn btn-outline btn-sm mobile-only-signout" id="mobile-logout-btn">Sign Out</button>
            </div>
          </header>
          <main class="content">
            ${
              (ws.announcements || []).length > 0
                ? (() => {
                    const latest = ws.announcements[ws.announcements.length - 1];
                    const pubMs = latest.createdAtMs || Date.parse(latest.createdAt) || Date.now();
                    const likes = Array.isArray(latest.likedBy) ? latest.likedBy : [];
                    const cmts = Array.isArray(latest.comments) ? latest.comments : [];
                    const liked = likes.includes(user.uid);
                    return `
                      <div class="notice-banner" role="region" aria-label="Latest Notice Banner">
                        <div style="min-width:220px; flex:1;">
                          <div style="display:flex; gap:0.45rem; align-items:center; flex-wrap:wrap; margin-bottom:0.2rem;">
                            <span class="badge badge-amber">📢 Latest Notice</span>
                            <span style="font-size:0.76rem; color:var(--ink-light); font-weight:600;">Published ${escapeHtml(formatDateTime(pubMs))}</span>
                          </div>
                          <div style="font-weight:800; font-size:0.98rem;">${escapeHtml(latest.title)}</div>
                          <div style="font-size:0.85rem; color:var(--ink-muted);">${escapeHtml(latest.body)}</div>
                        </div>
                        <div style="display:flex; gap:0.4rem; align-items:center; flex-wrap:wrap;">
                          <button type="button" class="ig-pill-btn ${liked ? 'liked' : ''}" data-like-notice="${escapeHtml(latest.id)}">${liked ? '❤️' : '🤍'} ${likes.length}</button>
                          <button type="button" class="btn btn-outline btn-sm" id="banner-jump-notices">💬 ${cmts.length} • Notices</button>
                          ${isHost ? `<button type="button" class="btn btn-danger btn-sm" data-del-notice="${escapeHtml(latest.id)}">Delete</button>` : ''}
                        </div>
                      </div>
                    `;
                  })()
                : ''
            }
            ${
              !isHost && user.biometricUpdateRequested
                ? `<div class="alert alert-warning" style="display:flex; justify-content:space-between; align-items:center; gap:0.75rem; flex-wrap:wrap; margin-bottom:1rem;">
                    <div>
                      <strong>Biometric Update Requested by Host:</strong>
                      ${escapeHtml(user.biometricUpdateReason || 'Please capture a fresh face biometric scan before voting.')}
                    </div>
                    <button type="button" class="btn btn-primary btn-sm" id="banner-update-biometric-btn">Update Biometric Now</button>
                  </div>`
                : ''
            }
            ${bodyHtml}
          </main>
        </div>
      </div>

      <nav class="mobile-bottom-nav">
        ${tabs
          .map(
            (t) => `<button class="mobile-nav-btn ${state.activeTab === t.id ? 'active' : ''}" data-tab="${t.id}">
              <span class="nav-pill-icon">${TAB_SVGS[t.id] || ''}</span>
              <span>${escapeHtml(t.short || t.label.split(' ')[0])}</span>
            </button>`
          )
          .join('')}
      </nav>
    `;

    bindWorkspaceEvents();
  }

  // ---------- Host: Classrooms, Drag & Drop Emails & Duplicate-Checked Face Review ----------

  function mergeInvites(existing, incoming) {
    const map = new Map();
    for (const item of existing || []) {
      const em = String(item?.email || item?.id || '').trim().toLowerCase();
      if (em) map.set(em, { ...item, id: em, email: em });
    }
    for (const item of incoming || []) {
      const em = String(item?.email || item?.id || '').trim().toLowerCase();
      if (em) map.set(em, { ...item, id: em, email: em });
    }
    return Array.from(map.values()).sort((a, b) => (a.email || '').localeCompare(b.email || ''));
  }

  function renderNoticesFeedHtml(ws, user, isHost) {
    const list = (ws.announcements || []).slice().reverse();
    if (list.length === 0) {
      return '<p style="color:var(--ink-light); margin:0;">No notices published yet.</p>';
    }
    return list
      .map((a) => {
        const pubMs = a.createdAtMs || Date.parse(a.createdAt) || Date.now();
        const likes = Array.isArray(a.likedBy) ? a.likedBy : [];
        const comments = Array.isArray(a.comments) ? a.comments : [];
        const isLiked = likes.includes(user.uid);
        return `
          <div class="notice-post">
            <div class="notice-post-meta">
              <div>
                <div style="font-weight:800; font-size:0.98rem;">${escapeHtml(a.title)}</div>
                <div style="font-size:0.75rem; color:var(--ink-light); font-weight:600;">
                  By ${escapeHtml(a.authorName || 'Community Host')} • Published ${escapeHtml(formatDateTime(pubMs))}
                </div>
              </div>
              ${isHost ? `<button type="button" class="btn btn-danger btn-sm" data-del-notice="${escapeHtml(a.id)}">Delete</button>` : ''}
            </div>
            <div style="font-size:0.9rem; color:var(--ink-muted); white-space:pre-line;">${escapeHtml(a.body)}</div>
            <div class="ig-action-bar">
              <button type="button" class="ig-pill-btn ${isLiked ? 'liked' : ''}" data-like-notice="${escapeHtml(a.id)}">
                <span>${isLiked ? '❤️' : '🤍'}</span>
                <span>${likes.length} ${likes.length === 1 ? 'Like' : 'Likes'}</span>
              </button>
              <span class="badge badge-slate">💬 ${comments.length} ${comments.length === 1 ? 'Comment' : 'Comments'}</span>
            </div>
            ${
              comments.length > 0
                ? `<div class="comment-list">
                    ${comments
                      .map((c) => {
                        const cMs = c.createdAtMs || Date.parse(c.createdAt) || Date.now();
                        const canDelCmt = isHost || c.uid === user.uid;
                        return `
                          <div class="comment-item">
                            <div>
                              <strong>${escapeHtml(c.authorName || 'Member')}</strong>
                              <span class="badge ${c.role === 'host' ? 'badge-amber' : 'badge-slate'}" style="padding:0.12rem 0.45rem; font-size:0.68rem;">${escapeHtml(c.role === 'host' ? 'Host' : 'Student')}</span>
                              <span style="font-size:0.72rem; color:var(--ink-light);">• ${escapeHtml(formatDateTime(cMs))}</span>
                              <div style="margin-top:0.18rem; color:var(--ink-muted);">${escapeHtml(c.text)}</div>
                            </div>
                            ${canDelCmt ? `<button type="button" class="btn btn-outline btn-sm" style="min-height:28px; padding:0.2rem 0.55rem; font-size:0.74rem;" data-del-cmt-notice="${escapeHtml(a.id)}" data-del-cmt-id="${escapeHtml(c.id)}">✕</button>` : ''}
                          </div>
                        `;
                      })
                      .join('')}
                  </div>`
                : ''
            }
            <form class="comment-add-form" data-comment-form="${escapeHtml(a.id)}" style="display:flex; gap:0.45rem; margin-top:0.65rem;">
              <input class="input" data-comment-input="${escapeHtml(a.id)}" placeholder="Add a comment..." required style="min-height:38px; padding:0.4rem 0.75rem; font-size:0.85rem;" />
              <button type="submit" class="btn btn-primary btn-sm">Post</button>
            </form>
          </div>
        `;
      })
      .join('');
  }

  function renderNoticesPage(ws, user, comm) {
    const isHost = user.role === 'host';
    return `
      <div class="page-header">
        <div>
          <h2>Notices, Likes & Comments</h2>
          <p>${escapeHtml(comm.name)} • Community feed with publish timestamps, likes & comments.</p>
        </div>
        ${isHost ? `<div class="action-row"><button type="button" class="btn btn-gold" id="host-add-notice-inline-btn">+ Publish Notice</button></div>` : ''}
      </div>

      <div class="card" id="notices-feed-card">
        <div class="card-header">
          <h3 class="card-title">📢 Community Feed (${(ws.announcements || []).length})</h3>
        </div>
        ${renderNoticesFeedHtml(ws, user, isHost)}
      </div>
    `;
  }

  function renderRequestsPage(ws, user, comm) {
    const isHost = user.role === 'host';
    if (isHost) {
      const invites = mergeInvites(ws.invites, []);
      ws.invites = invites;
      const pendingFaceApprovals = invites.filter((s) => s.onboardingStatus === 'pending_host_approval');
      const biometricRequestedList = invites.filter((s) => {
        const u = s.studentUid ? ws.users.find((x) => x.id === s.studentUid) : null;
        return Boolean(u?.biometricUpdateRequested ?? s.biometricUpdateRequested);
      });
      const pendingNoms = [];
      (ws.elections || []).forEach((el) => {
        (ws.nominationsByElection[el.id] || [])
          .filter((n) => n.status === 'pending')
          .forEach((n) => pendingNoms.push({ el, n }));
      });

      const activeEmails = new Set(invites.map((s) => String(s.email || '').trim().toLowerCase()));
      const allSignatures = [
        ...Object.entries(ws.faceProfiles || {}).map(([uid, fp]) => ({
          uid,
          email: fp.email,
          fullName: fp.fullName,
          descriptor: fp.descriptor,
          alignedPatch: fp.alignedPatch,
        })),
        ...(ws.users || [])
          .filter((u) => u.role === 'student' && (u.faceVec || u.alignedPatch))
          .map((u) => ({
            uid: u.id,
            email: u.email,
            fullName: u.fullName,
            descriptor: u.faceVec,
            alignedPatch: u.alignedPatch,
          })),
      ].filter((sig) => !sig.email || activeEmails.has(String(sig.email).trim().toLowerCase()));

      return `
        <div class="page-header">
          <div>
            <h2>Requests & Approvals</h2>
            <p>Review student face scans, candidate nomination requests, and biometric updates.</p>
          </div>
          <div class="action-row">
            <span class="badge badge-amber">Pending Face: ${pendingFaceApprovals.length}</span>
            <span class="badge badge-navy">Pending Candidates: ${pendingNoms.length}</span>
          </div>
        </div>

        <div class="card" style="border-left:4px solid var(--saffron);">
          <div class="card-header">
            <h3 class="card-title">Student Face Scan Requests (${pendingFaceApprovals.length})</h3>
          </div>
          ${
            pendingFaceApprovals.length === 0
              ? '<p style="color:var(--ink-light); margin:0;">No pending student face scan requests right now.</p>'
              : `<div style="display:grid; gap:0.75rem;">
                  ${pendingFaceApprovals
                    .map((inv, i) => {
                      const fp = inv.studentUid ? ws.faceProfiles[inv.studentUid] : null;
                      const dupCheck = fp ? Face.findDuplicateFace(fp, allSignatures, inv.studentUid) : { isDuplicate: false };
                      return `
                        <div class="candidate-item" style="${dupCheck.isDuplicate ? 'border-color:var(--danger); background:var(--danger-soft);' : ''}">
                          <div style="display:flex; gap:0.85rem; align-items:center;">
                            ${fp?.snapshotDataUrl ? `<img class="face-thumb" src="${fp.snapshotDataUrl}" alt="Face Scan" />` : ''}
                            <div>
                              <strong>${escapeHtml(inv.fullName || 'Student')}</strong> <span class="badge badge-navy">${escapeHtml(inv.classroomName || '—')}</span>
                              <div class="mono" style="color:var(--ink-muted);">${escapeHtml(inv.email)}</div>
                              ${
                                dupCheck.isDuplicate
                                  ? `<div style="font-size:0.78rem; color:var(--danger); font-weight:700;">⚠ Duplicate Face Alert: matches ${escapeHtml(dupCheck.matchedEmail)} (${dupCheck.similarityPct}%). Verify before approving.</div>`
                                  : `<div style="font-size:0.78rem; color:var(--india-green);">✓ Unique Face Verified • Liveness: ${fp?.livenessDelta ?? '—'}</div>`
                              }
                            </div>
                          </div>
                          <div class="action-row two-col">
                            <button class="btn btn-success btn-sm" data-approve-inv="${i}">${dupCheck.isDuplicate ? 'Approve Student Anyway' : 'Approve Student'}</button>
                            <button class="btn btn-danger btn-sm" data-reject-inv="${i}">Reject / Re-scan</button>
                          </div>
                        </div>
                      `;
                    })
                    .join('')}
                </div>`
          }
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Candidate Nomination Requests (${pendingNoms.length})</h3>
          </div>
          ${
            pendingNoms.length === 0
              ? '<p style="color:var(--ink-light); margin:0;">No pending candidate nomination requests.</p>'
              : `<div style="display:grid; gap:0.65rem;">
                  ${pendingNoms
                    .map(({ el, n }) => {
                      const photoUrl = getCandidatePhotoUrl(ws, n);
                      const thumbHtml = photoUrl
                        ? `<img class="avatar-circle" src="${photoUrl}" alt="${escapeHtml(n.fullName)}" style="width:40px; height:40px; flex:0 0 40px;" />`
                        : `<div class="avatar-circle" style="width:40px; height:40px; flex:0 0 40px; font-size:0.8rem; background:${escapeHtml(n.badgeColor || '#FF9933')};">${escapeHtml(n.fullName.slice(0, 2).toUpperCase())}</div>`;
                      return `
                        <div class="candidate-item">
                          <div style="display:flex; gap:0.7rem; align-items:center;">
                            ${thumbHtml}
                            <div>
                              <strong>${escapeHtml(n.fullName)}</strong> <span class="badge badge-slate">${escapeHtml(n.classroomName)}</span>
                              <div style="font-size:0.78rem; color:var(--ink-light); font-weight:700;">For: ${escapeHtml(el.title)} (${escapeHtml(el.position)})</div>
                              <div style="font-size:0.83rem; color:var(--ink-muted);">${escapeHtml(n.slogan ? `"${n.slogan}" — ` : '')}${escapeHtml(n.manifesto)}</div>
                            </div>
                          </div>
                          <div class="action-row two-col">
                            <button class="btn btn-success btn-sm" data-nom-act="approved" data-eid="${el.id}" data-nid="${n.id}">Approve</button>
                            <button class="btn btn-outline btn-sm" data-nom-act="rejected" data-eid="${el.id}" data-nid="${n.id}">Reject</button>
                            <button class="btn btn-danger btn-sm" style="grid-column:1 / -1;" data-del-cand-el="${el.id}" data-del-cand-id="${n.id}">Delete</button>
                          </div>
                        </div>
                      `;
                    })
                    .join('')}
                </div>`
          }
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Biometric Update Requests Sent (${biometricRequestedList.length})</h3>
          </div>
          ${
            biometricRequestedList.length === 0
              ? '<p style="color:var(--ink-light); margin:0;">No active biometric update requests sent. Use "Request Biometric" in Classrooms → Student Directory.</p>'
              : `<div style="display:grid; gap:0.55rem;">
                  ${biometricRequestedList
                    .map(
                      (s) => `
                    <div class="candidate-item">
                      <div>
                        <strong>${escapeHtml(s.fullName || s.email)}</strong> <span class="badge badge-amber">awaiting updated scan</span>
                        <div class="mono" style="font-size:0.78rem; color:var(--ink-muted);">${escapeHtml(s.email)} • ${escapeHtml(s.classroomName || '')}</div>
                      </div>
                      <button class="btn btn-outline btn-sm" data-dir-biometric-req="${escapeHtml(s.email)}">Re-send Request</button>
                    </div>
                  `
                    )
                    .join('')}
                </div>`
          }
        </div>
      `;
    }

    // Student Requests Page
    const myNoms = Object.values(ws.nominationsByElection || {})
      .flat()
      .filter((n) => n.studentUid === user.uid);
    const eligibleOpenElections = (ws.elections || []).filter((el) => {
      const ids = el.eligibleClassroomIds || [];
      const elig = ids.includes('*') || ids.includes(user.classroomId);
      return elig && el.status !== 'closed' && !myNoms.some((n) => n.electionId === el.id);
    });

    return `
      <div class="page-header">
        <div>
          <h2>My Requests</h2>
          <p>Respond to Host biometric requests and track or submit candidate nomination requests.</p>
        </div>

  function renderHostClassrooms(ws, host, comm) {
    const classrooms = ws.classrooms;
    const invites = mergeInvites(ws.invites, []);
    ws.invites = invites;
    const pendingFaceApprovals = invites.filter((s) => s.onboardingStatus === 'pending_host_approval');
    const allSignatures = [
      ...Object.entries(ws.faceProfiles || {}).map(([uid, fp]) => ({
        uid,
        email: fp.email,
        fullName: fp.fullName,
        descriptor: fp.descriptor,
        alignedPatch: fp.alignedPatch,
      })),
      ...(ws.users || [])
        .filter((u) => u.role === 'student' && (u.faceVec || u.alignedPatch))
        .map((u) => ({
          uid: u.id,
          email: u.email,
          fullName: u.fullName,
          descriptor: u.faceVec,
          alignedPatch: u.alignedPatch,
        })),
    ];

    return `
      <div class="page-header">
        <div>
          <h2>${escapeHtml(comm.name)} — Host Control</h2>
          <p>Add student emails, verify unique face scans, and manage classrooms & notices.</p>
        </div>
        <div class="action-row two-col">
          <button class="btn btn-outline" id="host-create-cls-btn">+ Classroom</button>
          <button class="btn btn-outline" id="host-add-notice-btn">+ Notice</button>
          <button class="btn btn-primary" style="grid-column: 1 / -1;" id="host-add-email-btn">+ Add Student Email</button>
        </div>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-label">Classrooms</div><div class="kpi-value">${classrooms.length}</div><div class="kpi-sub">Active sections</div></div>
        <div class="kpi-card"><div class="kpi-label">Student Emails</div><div class="kpi-value">${invites.length}</div><div class="kpi-sub">Registered roster</div></div>
        <div class="kpi-card"><div class="kpi-label">Face Scans Pending</div><div class="kpi-value">${pendingFaceApprovals.length}</div><div class="kpi-sub">Awaiting Host approval</div></div>
        <div class="kpi-card"><div class="kpi-label">Approved Voters</div><div class="kpi-value">${invites.filter((s) => s.onboardingStatus === 'approved').length}</div><div class="kpi-sub">Verified & ready</div></div>
      </div>

      ${
        pendingFaceApprovals.length > 0
          ? `
        <div class="alert alert-warning" style="display:flex; justify-content:space-between; align-items:center; gap:0.75rem; flex-wrap:wrap;">
          <div><strong>${pendingFaceApprovals.length} Student Face Scan Request(s)</strong> awaiting Host approval.</div>
          <button type="button" class="btn btn-gold btn-sm" id="go-requests-tab-btn">Open Requests</button>
        </div>
      `
          : ''
      }

      <div class="card">
        <div class="card-header">
          <div>
            <h3 class="card-title">Drag & Drop Student Email File (Edit Before Adding)</h3>
            <div style="font-size:0.83rem; color:var(--ink-muted);">Drop a <code>.csv</code>, <code>.txt</code>, or <code>.json</code> file of student emails. Edit any email or classroom below before saving.</div>
          </div>
          <input type="file" id="student-file-input" accept=".csv,.txt,.json" style="display:none;" />
        </div>

        <div class="drop-zone" id="student-drop-zone">
          <div class="drop-zone-icon">📂</div>
          <strong>Drag & Drop Student Emails File Here</strong>
          <div style="font-size:0.83rem; color:var(--ink-muted); margin-top:0.25rem;">
            or <span style="color:var(--saffron-deep); font-weight:700; text-decoration:underline;">browse file</span> (.csv, .txt, .json)
          </div>
        </div>

        ${
          state.stagedEmails.length > 0
            ? `
          <div style="margin-top:1.1rem;">
            <div class="card-header">
              <strong>Edit Emails Before Adding (${state.stagedEmails.length})</strong>
              <div class="action-row two-col">
                <button type="button" class="btn btn-outline btn-sm" id="stage-add-row">+ Row</button>
                <button type="button" class="btn btn-outline btn-sm" id="stage-clear">Clear</button>
                <button type="button" class="btn btn-success btn-sm" style="grid-column:1 / -1;" id="stage-commit-btn">Confirm & Save Emails</button>
              </div>
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Editable Student Email</th><th>Assign Classroom</th><th>Validation</th><th>Remove</th></tr></thead>
                <tbody>
                  ${state.stagedEmails
                    .map((row, idx) => {
                      const clean = row.email.trim().toLowerCase();
                      const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(clean);
                      const dup = invites.some((u) => u.email.toLowerCase() === clean);
                      return `
                        <tr>
                          <td><input class="input" data-stage-field="email" data-idx="${idx}" value="${escapeHtml(row.email)}" placeholder="student@college.edu" /></td>
                          <td>
                            <select class="select" data-stage-field="classroomName" data-idx="${idx}">
                              ${classrooms.map((c) => `<option value="${escapeHtml(c.name)}" ${c.name.toLowerCase() === row.classroomName.toLowerCase() ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
                            </select>
                          </td>
                          <td data-stage-badge="${idx}">${!valid ? '<span class="badge badge-red">Invalid</span>' : dup ? '<span class="badge badge-amber">Exists</span>' : '<span class="badge badge-green">Ready</span>'}</td>
                          <td><button type="button" class="btn btn-outline btn-sm" data-stage-del="${idx}">✕</button></td>
                        </tr>
                      `;
                    })
                    .join('')}
                </tbody>
              </table>
            </div>
          </div>
        `
            : ''
        }
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-header"><h3 class="card-title">Classrooms (${classrooms.length})</h3></div>
          <div style="display:grid; gap:0.55rem;">
            ${classrooms
              .map((c) => {
                const cnt = invites.filter((s) => s.classroomId === c.id).length;
                return `
                  <div class="candidate-item">
                    <div><strong>${escapeHtml(c.name)}</strong><div style="font-size:0.78rem; color:var(--ink-light);">${c.teacherName ? `Teacher: ${escapeHtml(c.teacherName)} • ` : ''}${cnt} students</div></div>
                    <div class="action-row two-col">
                      <button class="btn btn-outline btn-sm" data-add-act-cls="${c.id}">+ Activity</button>
                      <button class="btn btn-outline btn-sm" data-edit-cls="${c.id}">Edit</button>
                      <button class="btn btn-danger btn-sm" style="grid-column: 1 / -1;" data-del-cls="${c.id}">Delete</button>
                    </div>
                  </div>
                `;
              })
              .join('')}
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Student Directory (${invites.length})</h3>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Student</th><th>Classroom</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody>
                ${
                  invites.length === 0
                    ? '<tr><td colspan="4" style="color:var(--ink-light);">Add student emails above.</td></tr>'
                    : invites
                        .map((s) => {
                          const profileUser = s.studentUid ? ws.users.find((u) => u.id === s.studentUid) : null;
                          const canView = Boolean(profileUser || (s.studentUid && ws.faceProfiles[s.studentUid]));
                          const bioRequested = Boolean(profileUser?.biometricUpdateRequested ?? s.biometricUpdateRequested);
                          return `
                            <tr>
                              <td><strong>${escapeHtml(profileUser?.fullName || s.fullName || 'Awaiting Scan')}</strong><br><span class="mono" style="color:var(--ink-light);">${escapeHtml(s.email)}</span></td>
                              <td><span class="badge badge-navy">${escapeHtml(s.classroomName || '—')}</span></td>
                              <td>
                                <span class="badge ${s.onboardingStatus === 'approved' ? 'badge-green' : s.onboardingStatus === 'pending_host_approval' ? 'badge-amber' : 'badge-slate'}">${escapeHtml((s.onboardingStatus || '').replace(/_/g, ' '))}</span>
                                ${bioRequested ? '<br><span class="badge badge-amber" style="margin-top:0.25rem;">biometric requested</span>' : ''}
                              </td>
                              <td>
                                <div style="display:flex; gap:0.35rem; flex-wrap:wrap;">
                                  ${canView ? `<button class="btn btn-outline btn-sm" data-view-profile="${escapeHtml(s.studentUid)}">Profile</button>` : ''}
                                  ${s.onboardingStatus !== 'approved' && s.studentUid ? `<button class="btn btn-success btn-sm" data-dir-approve="${escapeHtml(s.email)}">Approve Student</button>` : ''}
                                  ${s.onboardingStatus === 'approved' || s.studentUid ? `<button class="btn btn-outline btn-sm" data-dir-biometric-req="${escapeHtml(s.email)}">${bioRequested ? 'Re-send Request' : 'Request Biometric'}</button>` : ''}
                                  <button class="btn btn-danger btn-sm" data-del-inv="${escapeHtml(s.email)}" data-del-uid="${escapeHtml(s.studentUid || '')}">Remove</button>
                                </div>
                              </td>
                            </tr>
                          `;
                        })
                        .join('')
                }
              </tbody>
            </table>
          </div>
        </div>
      </div>
    `;
  }

  // ---------- Student: Classroom & Activities ----------

  function renderStudentClassroom(ws, user, comm) {
    const cls = ws.classrooms.find((c) => c.id === user.classroomId);
    const announcements = ws.announcements.slice().reverse();
    const activities = ws.activities.filter((a) => a.classroomId === user.classroomId).slice().reverse();

    return `
      <div class="page-header">
        <div style="display:flex; gap:0.85rem; align-items:center;">
          ${renderCommunityLogoHtml(comm, 54)}
          <div>
            <h2>${escapeHtml(cls?.name || 'My Classroom')}</h2>
            <p>${escapeHtml(comm.name)} • Approved Student Access</p>
          </div>
        </div>
        <button class="btn btn-outline btn-sm" id="stu-view-host-profile">View Host Profile</button>
      </div>

      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Classroom Activities</h3>
          <button type="button" class="btn btn-outline btn-sm" id="go-notices-tab-btn">📢 Notices & Likes (${(ws.announcements || []).length})</button>

        ${
          activities.length === 0
            ? '<p style="color:var(--ink-light);">No activities posted yet.</p>'

        }
      </div>
    `;
  }

  // ---------- Elections, Candidates (with Delete & Open Now) & Voting ----------

  function renderElections(ws, user) {
    const isHost = user.role === 'host';
    const elections = ws.elections.filter((e) => e.status !== 'closed');

    return `
      <div class="page-header">
        <div>
          <h2>${isHost ? 'Elections & Candidate Management' : 'Candidate Profiles & Voting'}</h2>
          <p>${isHost ? 'Schedule elections, open early, add/delete candidates, and approve nominations.' : 'Inspect candidate profiles, manage your nomination, or cast your face-verified vote.'}</p>
        </div>
        ${isHost ? `<div class="action-row"><button class="btn btn-primary" id="host-create-el-btn">+ Schedule Election</button></div>` : ''}
      </div>

      ${
        elections.length === 0
          ? '<div class="card"><p style="color:var(--ink-light);">No active or scheduled elections right now.</p></div>'
          : elections
              .map((el) => {
                const eligIds = el.eligibleClassroomIds || [];
                const eligNames = eligIds.includes('*')
                  ? ['All Classes']
                  : eligIds.map((cid) => ws.classrooms.find((c) => c.id === cid)?.name).filter(Boolean);
                const isEligible = isHost || eligIds.includes('*') || eligIds.includes(user.classroomId);
                const noms = ws.nominationsByElection[el.id] || [];
                const approved = noms.filter((n) => n.status === 'approved');
                const myNom = noms.find((n) => n.studentUid === user.uid);
                const parts = ws.participationByElection[el.id] || [];
                const myPart = parts.find((vp) => vp.studentUid === user.uid);

                return `
                  <div class="card">
                    <div class="card-header">
                      <div>
                        <div style="display:flex; gap:0.4rem; flex-wrap:wrap; margin-bottom:0.3rem;">
                          <span class="badge badge-navy">${escapeHtml(el.position)}</span>
                          <span class="badge ${el.status === 'active' ? 'badge-green' : 'badge-amber'}">${el.status.toUpperCase()}</span>
                          <span class="badge badge-slate">Eligible: ${escapeHtml(eligNames.join(', '))}</span>
                        </div>
                        <h3 class="card-title" style="font-size:1.18rem;">${escapeHtml(el.title)}</h3>
                        <p style="margin:0.2rem 0 0; font-size:0.86rem; color:var(--ink-muted);">${escapeHtml(el.description)}</p>
                      </div>
                      <div class="clock-pill" data-cd-status="${el.status}" data-cd-start="${el.startAtMs}" data-cd-end="${el.endAtMs}">
                        ${el.status === 'active' ? `Closes in ${formatDuration(el.endAtMs - Date.now())}` : `Opens in ${formatDuration(el.startAtMs - Date.now())}`}
                      </div>
                    </div>

                    <div style="margin-bottom:0.95rem;">
                      <strong style="font-size:0.86rem;">Approved Candidates (${approved.length})</strong>
                      <div style="display:grid; gap:0.55rem; margin-top:0.45rem;">
                        ${
                          approved.length === 0
                            ? '<p style="font-size:0.85rem; color:var(--ink-light);">No approved candidates yet.</p>'
                            : approved
                                .map((c) => {
                                  const photoUrl = getCandidatePhotoUrl(ws, c);
                                  const avatarHtml = photoUrl
                                    ? `<img class="avatar-circle" src="${photoUrl}" alt="${escapeHtml(c.fullName)}" />`
                                    : `<div class="avatar-circle" style="background:${escapeHtml(c.badgeColor || '#FF9933')};">${escapeHtml(c.fullName.slice(0, 2).toUpperCase())}</div>`;
                                  return `
                                    <label class="candidate-item ${!isHost && el.status === 'active' && isEligible && !myPart ? 'selectable' : ''}">
                                      <div style="display:flex; gap:0.75rem; align-items:center;">
                                        ${!isHost && el.status === 'active' && isEligible && !myPart ? `<input type="radio" name="vote-el-${el.id}" value="${c.id}" />` : ''}
                                        ${avatarHtml}
                                        <div>
                                          <strong>${escapeHtml(c.fullName)}</strong> <span class="badge badge-slate">${escapeHtml(c.classroomName)}</span>
                                          <div style="font-size:0.83rem; color:var(--ink-muted);">${escapeHtml(c.slogan || c.manifesto)}</div>
                                        </div>
                                      </div>
                                      <div class="action-row two-col">
                                        <button type="button" class="btn btn-outline btn-sm" data-view-cand-el="${el.id}" data-view-cand-id="${c.id}">Profile</button>
                                        ${
                                          isHost
                                            ? `<button type="button" class="btn btn-outline btn-sm" data-host-cand-photo-el="${el.id}" data-host-cand-photo-id="${c.id}">${photoUrl ? 'Change Pic' : 'Upload Pic'}</button>
                                               <button type="button" class="btn btn-danger btn-sm" style="grid-column:1 / -1;" data-del-cand-el="${el.id}" data-del-cand-id="${c.id}">Delete Candidate</button>`
                                            : ''
                                        }
                                      </div>
                                    </label>
                                  `;
                                })
                                .join('')
                        }
                      </div>
                    </div>

                    ${
                      isHost
                        ? (() => {
                            const reviewNoms = noms.filter((n) => n.status !== 'approved');
                            return `
                      <div style="padding-top:0.85rem; border-top:1px solid var(--border); margin-bottom:0.85rem;">
                        <div class="card-header" style="margin-bottom:0.5rem;">
                          <strong style="font-size:0.86rem;">Nomination Requests (${reviewNoms.length})</strong>
                          <div class="action-row two-col">
                            <button class="btn btn-outline btn-sm" data-host-add-cand="${el.id}">+ Candidate</button>
                            <button class="btn btn-outline btn-sm" data-host-edit-classes="${el.id}">Edit Classes</button>
                            <button class="btn btn-outline btn-sm" data-host-edit-time="${el.id}">Edit Time</button>
                            ${el.status === 'scheduled' ? `<button class="btn btn-success btn-sm" data-host-open-el="${el.id}">Open Now</button>` : `<button class="btn btn-gold btn-sm" data-host-close-el="${el.id}">Close Now</button>`}
                            <button class="btn btn-gold btn-sm" data-pub-res="${el.id}">${el.resultsPublished ? 'Update Published Results' : 'Publish Results'}</button>
                            <button class="btn btn-danger btn-sm" data-host-del-el="${el.id}">Delete Election</button>
                          </div>
                        </div>
                        ${
                          reviewNoms.length === 0
                            ? '<p style="font-size:0.82rem; color:var(--ink-light); margin:0;">No pending or rejected nominations.</p>'
                            : reviewNoms
                                .map((n) => {
                                  const photoUrl = getCandidatePhotoUrl(ws, n);
                                  const thumbHtml = photoUrl
                                    ? `<img class="avatar-circle" src="${photoUrl}" alt="${escapeHtml(n.fullName)}" style="width:36px; height:36px; flex:0 0 36px;" />`
                                    : `<div class="avatar-circle" style="width:36px; height:36px; flex:0 0 36px; font-size:0.78rem; background:${escapeHtml(n.badgeColor || '#FF9933')};">${escapeHtml(n.fullName.slice(0, 2).toUpperCase())}</div>`;
                                  return `
                                <div class="candidate-item" style="margin-bottom:0.45rem;">
                                  <div style="display:flex; gap:0.65rem; align-items:center;">
                                    ${thumbHtml}
                                    <div>
                                      <strong>${escapeHtml(n.fullName)}</strong> (${escapeHtml(n.classroomName)}) —
                                      <span class="badge ${n.status === 'rejected' ? 'badge-red' : 'badge-amber'}">${escapeHtml(n.status)}</span>
                                      <div style="font-size:0.82rem; color:var(--ink-muted);">${escapeHtml(n.manifesto)}</div>
                                    </div>
                                  </div>
                                  <div class="action-row two-col">
                                    ${
                                      n.status === 'pending'
                                        ? `<button class="btn btn-success btn-sm" data-nom-act="approved" data-eid="${el.id}" data-nid="${n.id}">Approve</button>
                                           <button class="btn btn-outline btn-sm" data-nom-act="rejected" data-eid="${el.id}" data-nid="${n.id}">Reject</button>`
                                        : ''
                                    }
                                    <button class="btn btn-outline btn-sm" data-host-cand-photo-el="${el.id}" data-host-cand-photo-id="${n.id}">${photoUrl ? 'Change Pic' : 'Upload Pic'}</button>
                                    <button class="btn btn-danger btn-sm" data-del-cand-el="${el.id}" data-del-cand-id="${n.id}">Delete Candidate</button>
                                  </div>
                                </div>
                              `;
                                })
                                .join('')
                        }
                      </div>
                    `;
                          })()
                        : ''
                    }

                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.65rem; padding-top:0.75rem; border-top:1px solid var(--border);">
                      ${
                        isHost
                          ? (() => {
                              const eligibleStudents = (ws.invites || []).filter(
                                (s) =>
                                  s.onboardingStatus === 'approved' &&
                                  (el.eligibleClassroomIds.includes('*') || el.eligibleClassroomIds.includes(s.classroomId))
                              ).length;
                              const votedCount = parts.length;
                              return `<div style="display:flex; gap:0.45rem; align-items:center; flex-wrap:wrap;">
                                        <span class="badge badge-navy">Voted: ${votedCount}${eligibleStudents > 0 ? ` / ${eligibleStudents} students` : ' students'}</span>
                                        ${el.resultsPublished ? '<span class="badge badge-green">Results Published</span>' : '<span class="badge badge-slate">Results Private</span>'}
                                      </div>`;
                            })()
                          : `<div style="font-size:0.83rem; color:var(--ink-light);">${myPart ? 'Participation Confirmed' : 'Secret Ballot'}</div>`
                      }
                      <div class="action-row two-col">
                        ${
                          !isHost && isEligible
                            ? myNom
                              ? myNom.status === 'pending'
                                ? `<button class="btn btn-danger btn-sm" data-stu-del-nom-el="${el.id}" data-stu-del-nom-id="${myNom.id}">Withdraw Nomination</button>`
                                : `<span class="badge ${myNom.status === 'approved' ? 'badge-green' : 'badge-red'}">Nomination: ${escapeHtml(myNom.status)}</span>`
                              : `<button class="btn btn-outline btn-sm" data-stu-nom="${el.id}">Nominate Self</button>`
                            : ''
                        }
                        ${
                          !isHost
                            ? myPart
                              ? `<span class="badge badge-green">Voted • Receipt <span class="mono">${escapeHtml(myPart.receiptHash)}</span></span>`
                              : !isEligible
                              ? '<span class="badge badge-slate">Not eligible</span>'
                              : el.status === 'scheduled'
                              ? '<button class="btn btn-outline btn-sm" disabled>Opens Soon</button>'
                              : `<button class="btn btn-success" data-stu-vote="${el.id}">Submit Vote</button>`
                            : ''
                        }
                      </div>
                    </div>
                  </div>
                `;
              })
              .join('')
      }
    `;
  }

  // ---------- Results (Candidates & Students ONLY see results AFTER Host publishes!) ----------

  function renderResults(ws, user) {
    const isHost = user.role === 'host';
    const visibleElections = isHost
      ? ws.elections.slice()
      : ws.elections.filter((e) => e.status === 'closed' || e.resultsPublished === true);

    return `
      <div class="page-header">
        <div>
          <h2>Election Results</h2>
          <p>${
            isHost
              ? 'Monitor live student voter turnout and publish election results at any time.'
              : 'View election results published by your Community Host.'
          }</p>
        </div>
      </div>

      ${
        visibleElections.length === 0
          ? '<div class="card"><p style="color:var(--ink-light);">No results available yet.</p></div>'
          : visibleElections
              .map((el) => {
                const canSee = isHost || el.resultsPublished === true;
                const tallies = canSee ? ws.resultsByElection[el.id] || [] : [];
                const votedCount = (ws.participationByElection[el.id] || []).length;
                const eligibleStudents = (ws.invites || []).filter(
                  (s) =>
                    s.onboardingStatus === 'approved' &&
                    (el.eligibleClassroomIds.includes('*') || el.eligibleClassroomIds.includes(s.classroomId))
                ).length;

                return `
                  <div class="card">
                    <div class="card-header">
                      <div>
                        <div style="display:flex; gap:0.4rem; flex-wrap:wrap; align-items:center;">
                          <span class="badge badge-navy">${escapeHtml(el.position)}</span>
                          <span class="badge ${el.status === 'active' ? 'badge-green' : el.status === 'closed' ? 'badge-slate' : 'badge-amber'}">${escapeHtml((el.status || '').toUpperCase())}</span>
                          ${isHost ? `<span class="badge badge-navy">Voted: ${votedCount}${eligibleStudents > 0 ? ` / ${eligibleStudents} students` : ' students'}</span>` : ''}
                        </div>
                        <h3 class="card-title" style="margin-top:0.35rem;">${escapeHtml(el.title)}</h3>
                        <div style="font-size:0.8rem; color:var(--ink-light);">${el.status === 'closed' ? `Closed ${escapeHtml(formatDateTime(el.endAtMs))}` : `Ends ${escapeHtml(formatDateTime(el.endAtMs))}`}</div>
                      </div>
                      <div class="action-row two-col">
                        ${
                          canSee
                            ? `<button class="btn btn-outline btn-sm" data-export-csv="${el.id}">Export CSV</button>
                               <button class="btn btn-outline btn-sm" id="print-results-btn">Print</button>`
                            : ''
                        }
                        ${
                          isHost
                            ? `<button class="btn btn-outline btn-sm" data-host-edit-time="${el.id}">Edit Time</button>
                               <button class="btn ${el.resultsPublished ? 'btn-success' : 'btn-gold'} btn-sm" style="${canSee ? '' : 'grid-column:1 / -1;'}" data-pub-res="${el.id}">${el.resultsPublished ? 'Published • Update Results' : 'Publish Results Now'}</button>`
                            : el.resultsPublished
                            ? '<span class="badge badge-green">Published by Host</span>'
                            : '<span class="badge badge-amber">Waiting for Host to Publish</span>'
                        }
                      </div>
                    </div>

                    ${
                      canSee
                        ? tallies.length === 0
                          ? '<p style="font-size:0.85rem; color:var(--ink-light); margin:0;">No approved candidates yet.</p>'
                          : `
                      <div style="display:grid; gap:0.75rem;">
                        ${tallies
                          .map((r) => {
                            const candDoc = (ws.nominationsByElection[el.id] || []).find((n) => n.id === r.nominationId);
                            const photoUrl = r.photoDataUrl || getCandidatePhotoUrl(ws, candDoc);
                            return `
                          <div>
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.25rem; gap:0.5rem;">
                              <div style="display:flex; align-items:center; gap:0.5rem;">
                                ${
                                  photoUrl
                                    ? `<img class="avatar-circle" src="${photoUrl}" alt="${escapeHtml(r.fullName)}" style="width:30px; height:30px; flex:0 0 30px;" />`
                                    : ''
                                }
                                <span><strong>${escapeHtml(r.fullName)}</strong> (${escapeHtml(r.classroomName)}) ${r.isWinner ? '<span class="badge badge-amber">WINNER</span>' : ''}</span>
                              </div>
                              <strong>${r.voteCount} votes (${r.percentage}%)</strong>
                            </div>
                            <div class="progress-track"><div class="progress-fill" style="width:${r.percentage}%; background:${escapeHtml(r.badgeColor || '#138808')};"></div></div>
                          </div>
                        `;
                          })
                          .join('')}
                      </div>
                    `
                        : '<div class="alert alert-info">Voting has closed. Results remain confidential until the Community Host officially publishes them.</div>'
                    }
                  </div>
                `;
              })
              .join('')
      }
    `;
  }

        ${

            ${
              user.biometricUpdateRequested
                ? `<div class="alert alert-warning" style="margin-bottom:0.75rem;">
                     <strong>Update Requested by Host:</strong> ${escapeHtml(user.biometricUpdateReason || 'Capture an updated face scan.')}
                   </div>`
                : `<p style="font-size:0.86rem; color:var(--ink-muted); margin-top:0;">Your enrolled face biometric is verified for secret-ballot voting${user.biometricUpdatedAt ? ` (updated ${escapeHtml(formatDateTime(new Date(user.biometricUpdatedAt).getTime()))})` : ''}.</p>`
            }
            <button type="button" class="btn ${user.biometricUpdateRequested ? 'btn-primary' : 'btn-outline'}" style="width:100%; margin-bottom:1.15rem;" id="profile-update-biometric-btn">
              ${user.biometricUpdateRequested ? 'Scan Updated Biometric Now' : 'Update Face Biometric'}
            </button>

            <h3 class="card-title" style="margin-bottom:0.9rem;">My Candidate Nominations (${myNoms.length})</h3>
            ${
              myNoms.length === 0
                ? '<p style="color:var(--ink-light);">You have not stood as a candidate yet.</p>'
                : myNoms
                    .map((n) => {
                      const el = ws.elections.find((e) => e.id === n.electionId);
                      return `
                        <div class="candidate-item" style="margin-bottom:0.5rem;">
                          <div>
                            <strong>${escapeHtml(el?.title || '')}</strong>
                            <div style="font-size:0.8rem; color:var(--ink-muted);">${escapeHtml(n.manifesto)}</div>
                          </div>
                          <div class="action-row">
                            <span class="badge ${n.status === 'approved' ? 'badge-green' : n.status === 'rejected' ? 'badge-red' : 'badge-amber'}">${escapeHtml(n.status)}</span>
                            ${n.status === 'pending' ? `<button class="btn btn-danger btn-sm" data-stu-del-nom-el="${n.electionId}" data-stu-del-nom-id="${n.id}">Delete</button>` : ''}

              ${renderCommunityLogoHtml(comm, 62)}
              <div style="flex:1; min-width:160px;">
                <strong style="display:block;">${escapeHtml(comm.name)}</strong>
                <div style="font-size:0.78rem; color:var(--ink-muted);">Displayed to all students across the portal.</div>
              </div>
              <input type="file" id="host-logo-file" accept="image/*" style="display:none;" />
              <button type="button" class="btn btn-outline btn-sm" id="host-upload-logo-btn">${comm.logoDataUrl ? 'Change College Logo' : 'Upload College Logo'}</button>

              <div><strong>Community Code:</strong> <span class="mono">${escapeHtml(comm.code)}</span></div>

              <div><strong>Created On:</strong> ${escapeHtml(new Date(comm.createdAt).toLocaleString())}</div>

      ${

          ? `
        <div class="card">
          <div class="card-header"><h3 class="card-title">Community Audit Log (${logs.length})</h3></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Seq</th><th>Actor</th><th>Action</th><th>Details</th></tr></thead>
              <tbody>${logs.map((l) => `<tr><td class="mono">#${l.seq}</td><td>${escapeHtml(l.actorName)}</td><td class="mono"><strong>${escapeHtml(l.action)}</strong></td><td style="font-size:0.78rem;">${escapeHtml(l.detailsJson)}</td></tr>`).join('')}</tbody>
            </table>
          </div>

      }
    `;

  // ---------- Workspace Event Bindings ----------

  function bindWorkspaceEvents() {
    const user = state.sessionUser;
    const ws = state.ws;
    const comm = ws.community;

    const doLogout = async () => {
      state.authBusy = true;
      stopHostSync();
      try {
        await Store.signOut();
        state.sessionUser = null;
        state.ws = null;
        state.prefetchedFace = null;
        render();
      } finally {
        state.authBusy = false;
      }
    };
    document.getElementById('logout-btn')?.addEventListener('click', doLogout);
    document.getElementById('mobile-logout-btn')?.addEventListener('click', doLogout);
    document.getElementById('sync-ws-btn')?.addEventListener('click', () => refreshWorkspace().then(() => toast('Refreshed!', 'info')));
    document.getElementById('pwa-install-btn')?.addEventListener('click', triggerInstallApp);
    document.getElementById('settings-install-btn')?.addEventListener('click', triggerInstallApp);

    const hostLogoInp = document.getElementById('host-logo-file');
    document.getElementById('host-upload-logo-btn')?.addEventListener('click', () => hostLogoInp?.click());
    hostLogoInp?.addEventListener('change', async (ev) => {
      const file = ev.target.files?.[0];
      if (!file) return;
      try {
        const logoUrl = await readCandidatePhotoFile(file);
        await Store.updateCommunityLogo(comm.id, logoUrl);
        ws.community.logoDataUrl = logoUrl;
        toast('College / Community logo updated!', 'success');
        render();
      } catch (err) {
        toast(Store.formatError(err), 'error');
      }
    });

    document.querySelectorAll('[data-tab]').forEach((b) => {
      b.addEventListener('click', () => {
        state.activeTab = b.getAttribute('data-tab');
        render();
      });
    });

    const pendingInvites = (ws.invites || []).filter((s) => s.onboardingStatus === 'pending_host_approval');

    document.querySelectorAll('[data-approve-inv]').forEach((b) => {
      b.addEventListener('click', async () => {
        const inv = pendingInvites[Number(b.getAttribute('data-approve-inv'))];
        if (!inv) return;
        b.disabled = true;
        try {
          await Store.reviewStudentFaceScan(user, comm.id, inv, true);
          inv.onboardingStatus = 'approved';
          toast(`${inv.fullName || inv.email} approved!`, 'success');
          render();
        } catch (err) {
          b.disabled = false;
          toast(Store.formatError(err), 'error');
        }
      });
    });

    document.querySelectorAll('[data-reject-inv]').forEach((b) => {
      b.addEventListener('click', async () => {
        const inv = pendingInvites[Number(b.getAttribute('data-reject-inv'))];
        if (!inv) return;
        b.disabled = true;
        try {
          await Store.reviewStudentFaceScan(user, comm.id, inv, false);
          inv.onboardingStatus = 'rejected';
          toast(`Requested re-scan for ${inv.email}.`, 'info');
          render();
        } catch (err) {
          b.disabled = false;
          toast(Store.formatError(err), 'error');
        }
      });
    });

    // Drag & Drop File Import
    const dropZone = document.getElementById('student-drop-zone');
    const fileInput = document.getElementById('student-file-input');
    const handleFile = (file) => {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const defCls = ws.classrooms[0]?.name || '';
        state.stagedEmails = Store.parseEmailFile(String(reader.result || ''), defCls);
        toast(`Loaded ${state.stagedEmails.length} email rows. Edit before saving.`, 'success');
        render();
      };
      reader.readAsText(file);
    };
    if (dropZone && fileInput) {
      dropZone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
      });
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        handleFile(e.dataTransfer.files[0]);
      });
    }

    document.querySelectorAll('[data-stage-field]').forEach((inp) => {
      const evt = inp.tagName === 'SELECT' ? 'change' : 'input';
      inp.addEventListener(evt, (e) => {
        const idx = Number(e.target.getAttribute('data-idx'));
        const field = e.target.getAttribute('data-stage-field');
        if (!state.stagedEmails[idx]) return;
        state.stagedEmails[idx][field] = e.target.value;
        if (field === 'email') {
          const clean = e.target.value.trim().toLowerCase();
          const badgeCell = document.querySelector(`[data-stage-badge="${idx}"]`);
          if (badgeCell) {
            const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(clean);
            const dup = (ws.invites || []).some((u) => u.email.toLowerCase() === clean);
            badgeCell.innerHTML = !valid
              ? '<span class="badge badge-red">Invalid</span>'
              : dup
              ? '<span class="badge badge-amber">Exists</span>'
              : '<span class="badge badge-green">Ready</span>';
          }
        }
      });
    });

    document.querySelectorAll('[data-stage-del]').forEach((b) => {
      b.addEventListener('click', () => {
        state.stagedEmails.splice(Number(b.getAttribute('data-stage-del')), 1);
        render();
      });
    });

    document.getElementById('stage-add-row')?.addEventListener('click', () => {
      state.stagedEmails.push({ tempId: Date.now(), email: '', classroomName: ws.classrooms[0]?.name || '' });
      render();
    });

    document.getElementById('stage-clear')?.addEventListener('click', () => {
      state.stagedEmails = [];
      render();
    });

    document.getElementById('stage-commit-btn')?.addEventListener('click', async () => {
      document.querySelectorAll('[data-stage-field]').forEach((el) => {
        const idx = Number(el.getAttribute('data-idx'));
        const field = el.getAttribute('data-stage-field');
        if (state.stagedEmails[idx]) state.stagedEmails[idx][field] = el.value.trim();
      });
      const btn = document.getElementById('stage-commit-btn');
      btn.disabled = true;
      btn.textContent = 'Saving...';
      try {
        const created = await Store.addStudentEmails(user, comm, ws.classrooms, state.stagedEmails, ws.invites);
        ws.invites = mergeInvites(ws.invites, created);
        state.stagedEmails = [];
        toast(`Saved ${created.length} new student email(s)!`, 'success');
        render();
      } catch (err) {
        toast(Store.formatError(err), 'error');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Confirm & Save Emails';
        }
      }
    });

    // Host Add Single Student Email
    document.getElementById('host-add-email-btn')?.addEventListener('click', () => {
      const clsOpts = ws.classrooms.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
      openModal(`
        <h3 style="margin-top:0;">Add Student Email</h3>
        <p style="font-size:0.85rem; color:var(--ink-muted);">Only the student's email is needed. They will submit their unique face scan directly to you.</p>
        <form id="m-add-email">
          <div class="form-group"><label class="form-label">Classroom</label><select class="select" id="ae-c">${clsOpts}</select></div>
          <div class="form-group"><label class="form-label">Student Email Address</label><input class="input" type="email" id="ae-e" required placeholder="student@college.edu" /></div>
          <div class="modal-actions two-col">
            <button type="button" class="btn btn-outline" id="ae-x">Cancel</button>
            <button type="submit" class="btn btn-primary" id="ae-submit">Add Email</button>
          </div>
        </form>
      `);
      document.getElementById('ae-x').addEventListener('click', closeModal);
      document.getElementById('m-add-email').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('ae-submit');
        btn.disabled = true;
        try {
          const email = document.getElementById('ae-e').value.trim().toLowerCase();
          const classroomId = document.getElementById('ae-c').value;
          const created = await Store.addStudentEmails(user, comm, ws.classrooms, [{ email, classroomId }], ws.invites);
          if (created.length) ws.invites = mergeInvites(ws.invites, created);
          closeModal();
          toast(created.length ? `Added ${email}!` : 'Email already exists — duplicates are not allowed.', created.length ? 'success' : 'info');
          render();
        } catch (err) {
          toast(Store.formatError(err), 'error');
        } finally {
          if (btn) btn.disabled = false;
        }
      });
    });

    document.querySelectorAll('[data-dir-biometric-req]').forEach((b) => {
      b.addEventListener('click', async () => {
        const email = b.getAttribute('data-dir-biometric-req');
        const inv = ws.invites.find((i) => i.email === email);
        if (!inv) return;
        b.disabled = true;
        try {
          const requestedAt = await Store.requestStudentBiometricUpdate(user, comm.id, inv);
          inv.biometricUpdateRequested = true;
          inv.biometricUpdateRequestedAt = requestedAt;
          const u = inv.studentUid ? ws.users.find((x) => x.id === inv.studentUid) : null;
          if (u) {
            u.biometricUpdateRequested = true;
            u.biometricUpdateRequestedAt = requestedAt;
          }
          toast(`Biometric update request sent to ${email}!`, 'success');
          render();
        } catch (err) {
          b.disabled = false;
          toast(Store.formatError(err), 'error');
        }
      });
    });

    document.querySelectorAll('[data-dir-approve]').forEach((b) => {
      b.addEventListener('click', async () => {
        const email = b.getAttribute('data-dir-approve');
        const inv = (ws.invites || []).find((i) => i.email === email);
        if (!inv) return;
        b.disabled = true;
        try {
          await Store.reviewStudentFaceScan(user, comm.id, inv, true);
          inv.onboardingStatus = 'approved';
          const u = inv.studentUid ? (ws.users || []).find((x) => x.id === inv.studentUid) : null;
          if (u) {
            u.onboardingStatus = 'approved';
            u.hostApproved = true;
          }
          toast(`${inv.fullName || email} approved!`, 'success');
          render();
        } catch (err) {
          b.disabled = false;
          toast(Store.formatError(err), 'error');
        }
      });
    });

    document.querySelectorAll('[data-del-inv]').forEach((b) => {
      b.addEventListener('click', async () => {
        const email = b.getAttribute('data-del-inv');
        const uid = b.getAttribute('data-del-uid');
        const cleanEm = String(email || '').trim().toLowerCase();
        b.disabled = true;
        try {
          const deletedUids = await Store.removeStudentInvite(comm.id, email, uid);
          const delSet = new Set(deletedUids || []);
          if (uid) delSet.add(uid);
          ws.invites = (ws.invites || []).filter((i) => String(i.email || '').trim().toLowerCase() !== cleanEm);
          ws.users = (ws.users || []).filter(
            (u) => !delSet.has(u.id) && String(u.email || '').trim().toLowerCase() !== cleanEm
          );
          for (const k of Object.keys(ws.faceProfiles || {})) {
            const fp = ws.faceProfiles[k];
            if (delSet.has(k) || String(fp?.email || '').trim().toLowerCase() === cleanEm) {
              delete ws.faceProfiles[k];
            }
          }
          toast('Complete student data & photo deleted.', 'info');
          render();
        } catch (err) {
          b.disabled = false;
          toast(Store.formatError(err), 'error');
        }
      });
    });

    // Notices, Banner, Likes, Comments, Activities & Classrooms

        <h3 style="margin-top:0;">Schedule New Election</h3>

          <div class="form-row">
            <div class="form-group"><label class="form-label">Election Name</label><input class="input" id="el-t" required /></div>
